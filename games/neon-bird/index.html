<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f4;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  </style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<script>
(() => {
  // === Canvas & Hi-DPI ===
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.focus();
  window.addEventListener('load', () => canvas.focus());

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const W = () => window.innerWidth;
  const H = () => window.innerHeight;

  // === roundRect polyfill (older Safari) ===
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
      let r = typeof radii === 'number' ? radii : (Array.isArray(radii) ? radii[0] : 0);
      r = Math.max(0, Math.min(r, w / 2, h / 2));
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      this.closePath();
      return this;
    };
  }

  // === Colors (flat minimalist palette) ===
  const ACCENT = '#2563eb';
  const PURPLE = '#7c3aed';
  const RED = '#dc2626';
  const GREEN = '#16a34a';
  const ORANGE = '#ea580c';
  const YELLOW = '#ca8a04';
  const TEAL = '#0d9488';
  const PINK = '#db2777';
  const INK = '#1c1917';
  const MUTED = '#78716c';
  const LINE = '#d6d3d1';
  const SURFACE = '#ffffff';
  const FONT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";

  // === Helpers ===
  function hexToRgba(hex, a) {
    if (hex.startsWith('hsl')) return hex.replace(')', `, ${a})`).replace('hsl', 'hsla');
    if (hex.startsWith('rgb')) return hex.replace(')', `, ${a})`).replace('rgb', 'rgba');
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function lerpColor(hex1, hex2, t) {
    const r1 = parseInt(hex1.slice(1, 3), 16), g1 = parseInt(hex1.slice(3, 5), 16), b1 = parseInt(hex1.slice(5, 7), 16);
    const r2 = parseInt(hex2.slice(1, 3), 16), g2 = parseInt(hex2.slice(3, 5), 16), b2 = parseInt(hex2.slice(5, 7), 16);
    const r = Math.round(r1 + (r2 - r1) * t), g = Math.round(g1 + (g2 - g1) * t), b = Math.round(b1 + (b2 - b1) * t);
    return `rgb(${r},${g},${b})`;
  }

  // Flat white panel with a 1px border, used behind menu and game over text.
  function drawPanel(cx, top, bottom, maxW) {
    const pw = Math.min(maxW, W() - 32);
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.beginPath();
    ctx.roundRect(cx - pw / 2, top + 1, pw, bottom - top, 10);
    ctx.fill();
    ctx.fillStyle = SURFACE;
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(cx - pw / 2, top, pw, bottom - top, 10);
    ctx.fill();
    ctx.stroke();
  }

  // === Skin System ===
  // Every skin id the portal can send is kept; colours are toned down to the palette.
  const SKIN_DATA = {
    default: { primary: ACCENT, secondary: '#ffffff', trail: ACCENT },
    crimson: { primary: RED, secondary: '#fecaca', trail: RED },
    emerald: { primary: GREEN, secondary: '#bbf7d0', trail: GREEN },
    sunset: { primary: ORANGE, secondary: '#fde68a', trail: ORANGE },
    phantom: { primary: PURPLE, secondary: '#ddd6fe', trail: PURPLE },
    arctic: { primary: '#86c9c3', secondary: '#ffffff', trail: TEAL },
    golden: { primary: YELLOW, secondary: '#fef3c7', trail: YELLOW },
    inferno: { primary: RED, secondary: ORANGE, trail: ORANGE },
    void: { primary: INK, secondary: '#c4b5fd', trail: PURPLE },
    rainbow: { primary: 'rainbow', secondary: '#ffffff', trail: 'rainbow' },
    'corny-choklad':  { primary: '#6B3410', secondary: '#D4A574', trail: '#8B4513' },
    'corny-mork':     { primary: '#3D1C00', secondary: '#8B6914', trail: '#5C2E00' },
    'corny-vit':      { primary: '#FFF8DC', secondary: YELLOW, trail: '#D6C9A8' },
    'corny-kokos':    { primary: '#F5F5DC', secondary: '#8B7355', trail: '#C9B48F' },
    'corny-banan':    { primary: YELLOW, secondary: '#8B6914', trail: ORANGE },
    'corny-jordnot':  { primary: '#C4A265', secondary: '#8B6914', trail: '#B8860B' },
    'corny-jordgubb': { primary: PINK, secondary: '#fce7f3', trail: PINK },
    'corny-brownie':  { primary: '#4A2000', secondary: '#A0522D', trail: '#7B3F00' },
    'corny-karamell': { primary: '#C8963A', secondary: '#FFE4B5', trail: '#D4A574' }
  };

  // The rainbow skin steps calmly through the palette instead of cycling bright hues.
  const RAINBOW_STEPS = [ACCENT, PURPLE, PINK, RED, ORANGE, YELLOW, GREEN, TEAL];

  // Corny images
  const cornyImages = {};
  function loadCornyImg(id, filename) {
    const img = new Image();
    img._loaded = false;
    const paths = ['../../images/' + filename, '/images/' + filename];
    let idx = 0;
    img.onload = () => { img._loaded = true; };
    img.onerror = () => { idx++; if (idx < paths.length) img.src = paths[idx]; };
    img.src = paths[0];
    cornyImages[id] = img;
  }
  loadCornyImg('corny-choklad', 'corny-choklad.png');
  loadCornyImg('corny-mork', 'corny-mork.png');
  loadCornyImg('corny-vit', 'corny-vit.png');
  loadCornyImg('corny-kokos', 'corny-kokos.png');
  loadCornyImg('corny-banan', 'corny-banan.png');
  loadCornyImg('corny-jordnot', 'corny-jordnot.png');
  loadCornyImg('corny-jordgubb', 'corny-jordgubb.png');
  loadCornyImg('corny-brownie', 'corny-brownie.png');
  loadCornyImg('corny-karamell', 'corny-karamell.png');

  let skinPrimary = ACCENT;
  let skinSecondary = '#ffffff';
  let skinTrail = ACCENT;
  let _equippedSkinId = 'default';

  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'skin-data') {
      _equippedSkinId = e.data.skinId || 'default';
      loadSkin();
    }
  });

  function loadSkin() {
    const skin = SKIN_DATA[_equippedSkinId] || SKIN_DATA.default;
    if (skin.primary === 'rainbow') {
      const step = Math.floor(Date.now() / 600) % RAINBOW_STEPS.length;
      skinPrimary = RAINBOW_STEPS[step];
      skinSecondary = '#ffffff';
      skinTrail = RAINBOW_STEPS[(step + 1) % RAINBOW_STEPS.length];
    } else {
      skinPrimary = skin.primary;
      skinSecondary = skin.secondary;
      skinTrail = skin.trail;
    }
  }

  // === Game State ===
  const STATE = { MENU: 0, PLAYING: 1, DEAD: 2 };
  let state = STATE.MENU;

  // === Constants ===
  const GRAVITY = 0.45;
  const FLAP_FORCE = -7.5;
  const MAX_FALL_SPEED = 10;
  const Flappy Bird_RADIUS = 16;

  const PIPE_WIDTH = 60;
  const PIPE_GAP = 150;
  const PIPE_SPEED = 2.5;
  const PIPE_SPAWN_INTERVAL = 220;
  const PIPE_GAP_SHRINK = 0.8;
  const MIN_PIPE_GAP = 110;

  const COIN_CHANCE = 0.3;
  const COIN_RADIUS = 10;
  const GROUND_HEIGHT = 50;

  // === Game Variables ===
  let score = 0;
  let highScore = parseInt(localStorage.getItem('flappyFlappy Bird-highscore') || '0');
  let newRecord = false;
  let pipes = [];
  let coins = [];
  let distance = 0;

  const Flappy Bird = {
    x: 0, y: 0, vy: 0, rotation: 0, flapAnim: 0, alive: true, trail: []
  };

  let shakeTimer = 0;
  let flashTimer = 0;
  let deathParticles = [];
  let menuPulse = 0;

  // Zone system
  let currentZone = 0;
  let prevZone = 0;
  let nextZone = 0;
  let zoneBlend = 1;

  // Each theme is a calm, flat background tint with its own pipe colour.
  const ZONES = [
    {
      name: 'Rymden',
      bgColor: '#eceef4',
      pipeColor: PURPLE,
      groundColor: '#d9dce6'
    },
    {
      name: 'Havet',
      bgColor: '#e6f1f0',
      pipeColor: TEAL,
      groundColor: '#cde2df'
    },
    {
      name: 'Skogen',
      bgColor: '#ecf2e8',
      pipeColor: GREEN,
      groundColor: '#d5e3cf'
    }
  ];

  function getZoneValue(key) {
    const a = ZONES[prevZone][key];
    const b = ZONES[nextZone][key];
    if (typeof a === 'number') return a + (b - a) * zoneBlend;
    if (typeof a === 'string' && a.startsWith('#')) return lerpColor(a, b, zoneBlend);
    return zoneBlend < 0.5 ? a : b;
  }

  function updateZone() {
    const newZone = Math.floor(score / 15) % 3;
    if (newZone !== currentZone) {
      prevZone = currentZone;
      nextZone = newZone;
      currentZone = newZone;
      zoneBlend = 0;
    }
    if (zoneBlend < 1) {
      zoneBlend = Math.min(1, zoneBlend + 0.01);
    }
  }

  // === Screen delay ===
  let lastScreenChange = 0;
  const SCREEN_DELAY = 400;
  function screenReady() { return Date.now() - lastScreenChange > SCREEN_DELAY; }

  // === Init ===
  function initFlappy Bird() {
    Flappy Bird.x = W() * 0.22;
    Flappy Bird.y = H() / 2;
    Flappy Bird.vy = 0;
    Flappy Bird.rotation = 0;
    Flappy Bird.flapAnim = 0;
    Flappy Bird.alive = true;
    Flappy Bird.trail = [];
  }

  // === Pipe generation ===
  function spawnPipe() {
    const gapSize = Math.max(MIN_PIPE_GAP, PIPE_GAP - score * PIPE_GAP_SHRINK);
    const minY = gapSize / 2 + 40;
    const maxY = H() - GROUND_HEIGHT - gapSize / 2 - 40;
    const gapY = minY + Math.random() * (maxY - minY);

    const pipe = {
      x: W() + PIPE_WIDTH,
      gapY: gapY,
      gapSize: gapSize,
      scored: false,
      color: getZoneValue('pipeColor')
    };

    if (Math.random() < COIN_CHANCE) {
      coins.push({
        x: pipe.x + PIPE_WIDTH / 2,
        y: gapY + (Math.random() - 0.5) * gapSize * 0.4,
        collected: false,
        glowPhase: Math.random() * Math.PI * 2
      });
    }

    pipes.push(pipe);
  }

  // === Collision ===
  function checkCollision() {
    const bx = Flappy Bird.x, by = Flappy Bird.y, br = Flappy Bird_RADIUS * 0.7;

    if (by + br > H() - GROUND_HEIGHT) return true;
    if (by - br < 0) return true;

    for (const pipe of pipes) {
      const pipeLeft = pipe.x;
      const pipeRight = pipe.x + PIPE_WIDTH;
      if (bx + br > pipeLeft && bx - br < pipeRight) {
        const gapTop = pipe.gapY - pipe.gapSize / 2;
        const gapBottom = pipe.gapY + pipe.gapSize / 2;
        if (by - br < gapTop || by + br > gapBottom) return true;
      }
    }
    return false;
  }

  // === Scoring ===
  function updateScoring() {
    for (const pipe of pipes) {
      if (!pipe.scored && pipe.x + PIPE_WIDTH < Flappy Bird.x) {
        pipe.scored = true;
        score++;
      }
    }
    for (const coin of coins) {
      if (coin.collected) continue;
      const dx = Flappy Bird.x - coin.x;
      const dy = Flappy Bird.y - coin.y;
      if (Math.sqrt(dx * dx + dy * dy) < Flappy Bird_RADIUS + COIN_RADIUS) {
        coin.collected = true;
        score += 3;
        flashTimer = 3;
      }
    }
  }

  // === Flap ===
  function flap() {
    if (state === STATE.PLAYING && Flappy Bird.alive) {
      Flappy Bird.vy = FLAP_FORCE;
      Flappy Bird.flapAnim = 1;
    }
  }

  // === Start / Die ===
  function startGame() {
    score = 0;
    distance = 0;
    pipes = [];
    coins = [];
    deathParticles = [];
    shakeTimer = 0;
    flashTimer = 0;
    newRecord = false;
    currentZone = 0;
    prevZone = 0;
    nextZone = 0;
    zoneBlend = 1;
    initFlappy Bird();
    loadSkin();
    state = STATE.PLAYING;
    lastScreenChange = Date.now();
  }

  function die() {
    Flappy Bird.alive = false;
    state = STATE.DEAD;
    shakeTimer = 20;
    flashTimer = 8;
    lastScreenChange = Date.now();

    if (score > highScore) {
      highScore = score;
      newRecord = true;
      localStorage.setItem('flappyFlappy Bird-highscore', highScore.toString());
    }

    if (score > 0 && window.parent !== window) {
      window.parent.postMessage({ type: 'game-score', score: score }, '*');
    }

    for (let i = 0; i < 20; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 7 + 2;
      deathParticles.push({
        x: Flappy Bird.x, y: Flappy Bird.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: Math.random() * 4 + 2,
        life: 1,
        decay: Math.random() * 0.03 + 0.01,
        color: skinPrimary
      });
    }
  }

  // === Input ===
  canvas.addEventListener('mousedown', (e) => {
    e.preventDefault();
    canvas.focus();
    if (state === STATE.PLAYING) {
      flap();
    } else if (state === STATE.MENU && screenReady()) {
      startGame();
    } else if (state === STATE.DEAD && shakeTimer <= 0 && screenReady()) {
      state = STATE.MENU;
      lastScreenChange = Date.now();
    }
  });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    canvas.focus();
    if (state === STATE.PLAYING) {
      flap();
    } else if (state === STATE.MENU && screenReady()) {
      startGame();
    } else if (state === STATE.DEAD && shakeTimer <= 0 && screenReady()) {
      state = STATE.MENU;
      lastScreenChange = Date.now();
    }
  }, { passive: false });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (e.repeat) return;
      if (state === STATE.PLAYING) {
        flap();
      } else if (state === STATE.MENU && screenReady()) {
        startGame();
      } else if (state === STATE.DEAD && shakeTimer <= 0 && screenReady()) {
        state = STATE.MENU;
        lastScreenChange = Date.now();
      }
    }
  });

  // === Drawing ===
  function drawBackground() {
    ctx.fillStyle = getZoneValue('bgColor');
    ctx.fillRect(0, 0, W(), H());
  }

  function drawGround() {
    const groundY = H() - GROUND_HEIGHT;
    const gc = getZoneValue('groundColor');

    ctx.fillStyle = gc;
    ctx.fillRect(0, groundY, W(), GROUND_HEIGHT);

    ctx.strokeStyle = hexToRgba(INK, 0.15);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W(), groundY);
    ctx.stroke();

    // Faint scrolling ground lines (motion reference)
    const scrollOffset = (distance * 0.8) % 40;
    ctx.strokeStyle = hexToRgba(INK, 0.06);
    ctx.lineWidth = 1;
    for (let x = -scrollOffset; x < W(); x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, groundY);
      ctx.lineTo(x, H());
      ctx.stroke();
    }
  }

  function drawPipe(pipe) {
    const gapTop = pipe.gapY - pipe.gapSize / 2;
    const gapBot = pipe.gapY + pipe.gapSize / 2;
    const lipW = 8;
    const lipH = 12;

    ctx.fillStyle = pipe.color;

    // Top pipe + lip
    ctx.fillRect(pipe.x, 0, PIPE_WIDTH, gapTop);
    ctx.beginPath();
    ctx.roundRect(pipe.x - lipW, gapTop - lipH, PIPE_WIDTH + lipW * 2, lipH, 6);
    ctx.fill();

    // Bottom pipe + lip
    ctx.fillRect(pipe.x, gapBot, PIPE_WIDTH, H() - GROUND_HEIGHT - gapBot);
    ctx.beginPath();
    ctx.roundRect(pipe.x - lipW, gapBot, PIPE_WIDTH + lipW * 2, lipH, 6);
    ctx.fill();
  }

  function drawCoins() {
    for (const coin of coins) {
      if (coin.collected) continue;
      coin.glowPhase += 0.03;

      ctx.fillStyle = YELLOW;
      ctx.beginPath();
      ctx.arc(coin.x, coin.y, COIN_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = hexToRgba('#ffffff', 0.5);
      ctx.beginPath();
      ctx.arc(coin.x, coin.y, COIN_RADIUS * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Flat Flappy Bird body, wing, eye and beak. Shared by the game and the menu.
  function drawFlappy BirdShape(r, wingDeg) {
    // Body
    ctx.fillStyle = skinPrimary;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Wing
    ctx.save();
    ctx.translate(-r * 0.3, -r * 0.2);
    ctx.rotate((wingDeg - 15) * Math.PI / 180);
    ctx.fillStyle = skinSecondary;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.9, r * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    // Eye
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(r * 0.35, -r * 0.2, r * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.arc(r * 0.45, -r * 0.2, r * 0.12, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = ORANGE;
    ctx.beginPath();
    ctx.moveTo(r * 0.75, -r * 0.15);
    ctx.lineTo(r * 1.3, 0);
    ctx.lineTo(r * 0.75, r * 0.15);
    ctx.closePath();
    ctx.fill();
  }

  function drawFlappy Bird() {
    if (!Flappy Bird.alive) return;
    if (_equippedSkinId === 'rainbow') loadSkin();

    // Trail (subtle, flat)
    if (Flappy Bird.trail.length > 1) {
      for (let i = 1; i < Flappy Bird.trail.length; i++) {
        const pct = i / Flappy Bird.trail.length;
        ctx.strokeStyle = hexToRgba(skinTrail, pct * 0.2);
        ctx.lineWidth = pct * Flappy Bird_RADIUS * 0.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(Flappy Bird.trail[i - 1].x, Flappy Bird.trail[i - 1].y);
        ctx.lineTo(Flappy Bird.trail[i].x, Flappy Bird.trail[i].y);
        ctx.stroke();
      }
    }

    ctx.save();
    ctx.translate(Flappy Bird.x, Flappy Bird.y);

    const r = Flappy Bird_RADIUS;
    const cornyImage = cornyImages[_equippedSkinId];
    const isCorny = cornyImage && cornyImage._loaded;

    if (isCorny) {
      Flappy Bird.rotation = Math.max(-10, Math.min(15, Flappy Bird.vy * 1.5));
    } else {
      Flappy Bird.rotation = Math.max(-30, Math.min(70, Flappy Bird.vy * 4));
    }
    ctx.rotate(Flappy Bird.rotation * Math.PI / 180);

    if (isCorny) {
      const imgH = r * 2;
      const imgW = imgH * 3.4;
      ctx.drawImage(cornyImage, -imgW / 2, -imgH / 2, imgW, imgH);
    } else {
      Flappy Bird.flapAnim *= 0.85;
      const wingAngle = Math.sin(Flappy Bird.flapAnim * Math.PI * 3) * 25;
      drawFlappy BirdShape(r, wingAngle);
    }

    ctx.restore();
  }

  function drawMenuFlappy Bird(x, y) {
    ctx.save();
    ctx.translate(x, y);

    const r = Flappy Bird_RADIUS * 1.5;
    const t = Date.now() * 0.003;
    const wingFlap = Math.sin(t * 3) * 20;

    const menuCornyImg = cornyImages[_equippedSkinId];
    const isCornyMenu = menuCornyImg && menuCornyImg._loaded;

    if (isCornyMenu) {
      const imgH = r * 2;
      const imgW = imgH * 3.4;
      ctx.drawImage(menuCornyImg, -imgW / 2, -imgH / 2, imgW, imgH);
    } else {
      drawFlappy BirdShape(r, wingFlap);
    }

    ctx.restore();
  }

  function drawDeathParticles() {
    for (const p of deathParticles) {
      ctx.fillStyle = hexToRgba(p.color, p.life * 0.8);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawUI() {
    ctx.textAlign = 'center';
    ctx.fillStyle = INK;
    ctx.font = `700 48px ${FONT}`;
    ctx.fillText(score.toString(), W() / 2, 60);

    // Zone name
    const zone = ZONES[currentZone];
    ctx.textAlign = 'right';
    ctx.font = `600 12px ${FONT}`;
    ctx.fillStyle = MUTED;
    ctx.fillText(zone.name, W() - 15, 25);
    ctx.textAlign = 'center';
  }

  function drawMenu() {
    menuPulse += 0.03;
    loadSkin();

    const baseY = H() * 0.35;
    ctx.fillStyle = 'rgba(245,245,244,0.6)';
    ctx.fillRect(0, 0, W(), H());
    drawPanel(W() / 2, baseY - 70, baseY + (highScore > 0 ? 190 : 160), 360);

    const bobY = baseY + Math.sin(menuPulse * 1.5) * 8;
    drawMenuFlappy Bird(W() / 2, bobY);

    ctx.textAlign = 'center';

    // Title
    ctx.fillStyle = INK;
    ctx.font = `700 44px ${FONT}`;
    ctx.fillText('Flappy Bird', W() / 2, baseY + 72);

    // Subtitle
    ctx.font = `400 14px ${FONT}`;
    ctx.fillStyle = MUTED;
    ctx.fillText('Rymden  ·  Havet  ·  Skogen', W() / 2, baseY + 98);

    // Play prompt
    ctx.font = `600 18px ${FONT}`;
    ctx.fillStyle = ACCENT;
    ctx.fillText('Tryck för att starta', W() / 2, baseY + 135);

    // High score
    if (highScore > 0) {
      ctx.font = `600 16px ${FONT}`;
      ctx.fillStyle = MUTED;
      ctx.fillText(`Bästa: ${highScore}`, W() / 2, baseY + 168);
    }
  }

  function drawDeathScreen() {
    ctx.fillStyle = 'rgba(245,245,244,0.92)';
    ctx.fillRect(0, 0, W(), H());

    drawPanel(W() / 2, H() / 2 - 95, H() / 2 + 130, 340);

    ctx.textAlign = 'center';

    ctx.fillStyle = RED;
    ctx.font = `700 36px ${FONT}`;
    ctx.fillText('Game over', W() / 2, H() / 2 - 40);

    ctx.fillStyle = INK;
    ctx.font = `700 28px ${FONT}`;
    ctx.fillText(`Poäng: ${score}`, W() / 2, H() / 2 + 10);

    ctx.fillStyle = MUTED;
    ctx.font = `600 16px ${FONT}`;
    ctx.fillText(`Bästa: ${highScore}`, W() / 2, H() / 2 + 40);

    if (newRecord && score > 0) {
      ctx.fillStyle = GREEN;
      ctx.font = `700 18px ${FONT}`;
      ctx.fillText('Nytt rekord!', W() / 2, H() / 2 + 68);
    }

    if (shakeTimer <= 0) {
      ctx.fillStyle = ACCENT;
      ctx.font = `600 16px ${FONT}`;
      ctx.fillText('Tryck för att fortsätta', W() / 2, H() / 2 + 105);
    }
  }

  // === Update ===
  function update() {
    if (state === STATE.PLAYING) {
      Flappy Bird.vy += GRAVITY;
      Flappy Bird.vy = Math.min(Flappy Bird.vy, MAX_FALL_SPEED);
      Flappy Bird.y += Flappy Bird.vy;

      Flappy Bird.trail.push({ x: Flappy Bird.x, y: Flappy Bird.y });
      if (Flappy Bird.trail.length > 15) Flappy Bird.trail.shift();

      for (const pipe of pipes) pipe.x -= PIPE_SPEED;
      for (const coin of coins) coin.x -= PIPE_SPEED;

      pipes = pipes.filter(p => p.x + PIPE_WIDTH > -20);
      coins = coins.filter(c => c.x > -20 && !c.collected);

      const lastPipe = pipes[pipes.length - 1];
      if (!lastPipe || lastPipe.x < W() - PIPE_SPAWN_INTERVAL) {
        spawnPipe();
      }

      distance += PIPE_SPEED;
      updateZone();
      updateScoring();

      if (checkCollision()) die();
    }

    if (shakeTimer > 0) shakeTimer--;
    if (flashTimer > 0) flashTimer--;

    for (const p of deathParticles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.life -= p.decay;
    }
    deathParticles = deathParticles.filter(p => p.life > 0);
  }

  // === Game Loop ===
  function gameLoop() {
    update();
    ctx.save();

    if (shakeTimer > 0) {
      ctx.translate(
        (Math.random() - 0.5) * shakeTimer * 1.5,
        (Math.random() - 0.5) * shakeTimer * 1.5
      );
    }

    drawBackground();
    drawGround();

    if (state === STATE.PLAYING) {
      for (const pipe of pipes) drawPipe(pipe);
      drawCoins();
      drawFlappy Bird();
      drawUI();
    } else if (state === STATE.DEAD) {
      for (const pipe of pipes) drawPipe(pipe);
      drawCoins();
      drawDeathParticles();
      drawDeathScreen();
    } else {
      drawMenu();
    }

    if (flashTimer > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flashTimer / 8 * 0.4})`;
      ctx.fillRect(0, 0, W(), H());
    }

    ctx.restore();
    requestAnimationFrame(gameLoop);
  }

  // === Bootstrap ===
  loadSkin();
  gameLoop();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-Rex</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f4;
      color: #1c1917;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  </style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.focus();
  window.addEventListener('load', () => canvas.focus());

  // roundRect polyfill
  if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (typeof r === 'number') r = [r,r,r,r];
      const [tl,tr,br,bl] = r;
      this.moveTo(x+tl, y);
      this.lineTo(x+w-tr, y);
      this.quadraticCurveTo(x+w, y, x+w, y+tr);
      this.lineTo(x+w, y+h-br);
      this.quadraticCurveTo(x+w, y+h, x+w-br, y+h);
      this.lineTo(x+bl, y+h);
      this.quadraticCurveTo(x, y+h, x, y+h-bl);
      this.lineTo(x, y+tl);
      this.quadraticCurveTo(x, y, x+tl, y);
      this.closePath();
    };
  }

  // Hi-DPI
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const W = () => window.innerWidth;
  const H = () => window.innerHeight;

  // Palette (flat minimalist)
  const C_BG = '#f5f5f4';
  const C_SURFACE = '#ffffff';
  const C_SURFACE2 = '#e7e5e4';
  const C_LINE = '#d6d3d1';
  const C_INK = '#1c1917';
  const C_MUTED = '#78716c';
  const C_ACCENT = '#2563eb';
  const C_RED = '#dc2626';
  const C_GREEN = '#16a34a';
  const C_ORANGE = '#ea580c';
  const C_PURPLE = '#7c3aed';
  const FONT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";

  // Game state
  let state = 'menu';
  let score = 0;
  let highScore = parseInt(localStorage.getItem('neon-rex-hi') || '0');
  let gameSpeed = 6;
  let frameCount = 0;
  let groundY = 0;

  // Dino
  const dino = {
    x: 60, y: 0, w: 44, h: 48,
    vy: 0, jumping: false, ducking: false,
    legFrame: 0, legTimer: 0,
  };
  const GRAVITY = 0.6;
  const JUMP_FORCE = -12;
  const DUCK_H = 30;

  // Obstacles
  let obstacles = [];
  let obstacleTimer = 0;

  // Stars (background)
  let stars = [];
  for (let i = 0; i < 60; i++) {
    stars.push({ x: Math.random() * 2000, y: Math.random() * 0.7, speed: 0.2 + Math.random() * 0.5, size: 1 + Math.random() * 2 });
  }

  // Ground tiles
  let groundOffset = 0;

  // Particles
  let particles = [];

  // Input
  let keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'ArrowUp') e.preventDefault();
    if (state === 'menu') startGame();
    if (state === 'gameover' && (e.key === ' ' || e.key === 'ArrowUp')) startGame();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (state === 'menu') startGame();
    else if (state === 'gameover') startGame();
    else {
      const ty = e.touches[0].clientY;
      if (ty > H() * 0.6) {
        dino.ducking = true;
      } else {
        jump();
      }
    }
  });
  canvas.addEventListener('touchend', e => {
    dino.ducking = false;
  });

  canvas.addEventListener('click', () => {
    if (state === 'menu') startGame();
    else if (state === 'gameover') startGame();
  });

  function jump() {
    if (!dino.jumping) {
      dino.vy = JUMP_FORCE;
      dino.jumping = true;
      dino.ducking = false;
      spawnParticles(dino.x + dino.w / 2, groundY, C_MUTED, 6);
    }
  }

  function startGame() {
    state = 'playing';
    score = 0;
    gameSpeed = 6;
    frameCount = 0;
    obstacles = [];
    obstacleTimer = 0;
    particles = [];
    dino.y = 0;
    dino.vy = 0;
    dino.jumping = false;
    dino.ducking = false;
  }

  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 5,
        vy: -Math.random() * 4 - 1,
        life: 1,
        decay: 0.03 + Math.random() * 0.03,
        size: 2 + Math.random() * 3,
        color,
      });
    }
  }

  function spawnObstacle() {
    const type = Math.random();
    if (type < 0.35) {
      // Small cactus (crystal)
      obstacles.push({ type: 'small', x: W() + 50, w: 20, h: 40 + Math.random() * 15 });
    } else if (type < 0.65) {
      // Tall cactus (pillar)
      obstacles.push({ type: 'tall', x: W() + 50, w: 22, h: 55 + Math.random() * 15 });
    } else if (type < 0.8) {
      // Double obstacle
      obstacles.push({ type: 'double', x: W() + 50, w: 50, h: 40 });
    } else {
      // Flying pterodactyl (drone)
      const flyH = Math.random() < 0.5 ? 0 : 35;
      obstacles.push({ type: 'flyer', x: W() + 50, w: 40, h: 28, flyHeight: flyH, wingFrame: 0 });
    }
  }

  function update() {
    if (state !== 'playing') return;
    frameCount++;

    // Speed increases over time
    gameSpeed = 6 + frameCount * 0.001;

    // Ground position
    groundY = H() * 0.75;

    // Score
    if (frameCount % 5 === 0) {
      score++;
    }

    // Input
    if (keys[' '] || keys['ArrowUp'] || keys['w'] || keys['W']) jump();
    dino.ducking = !dino.jumping && (keys['ArrowDown'] || keys['s'] || keys['S']);

    // Dino physics
    dino.vy += GRAVITY;
    dino.y += dino.vy;
    if (dino.y >= 0) {
      dino.y = 0;
      dino.vy = 0;
      dino.jumping = false;
    }

    // Dino animation
    dino.legTimer++;
    if (dino.legTimer > 6) {
      dino.legTimer = 0;
      dino.legFrame = (dino.legFrame + 1) % 2;
    }

    // Ground scroll
    groundOffset = (groundOffset + gameSpeed) % 40;

    // Stars scroll
    for (const s of stars) {
      s.x -= s.speed * gameSpeed * 0.3;
      if (s.x < -10) s.x = W() + 10;
    }

    // Obstacle spawning
    obstacleTimer -= gameSpeed;
    if (obstacleTimer <= 0) {
      spawnObstacle();
      obstacleTimer = 200 + Math.random() * 300;
    }

    // Move obstacles
    for (const o of obstacles) {
      o.x -= gameSpeed;
      if (o.type === 'flyer') o.wingFrame = Math.floor(frameCount / 10) % 2;
    }
    obstacles = obstacles.filter(o => o.x + o.w > -50);

    // Collision detection
    const dh = dino.ducking ? DUCK_H : dino.h;
    const dx = dino.x + 6;
    const dy = groundY - dh + dino.y;
    const dw = dino.w - 12;

    for (const o of obstacles) {
      let ox = o.x + 4;
      let oy = groundY - o.h;
      let ow = o.w - 8;
      let oh = o.h;

      if (o.type === 'flyer') {
        oy = groundY - 30 - o.flyHeight;
        oh = o.h;
      }

      if (dx + dw > ox && dx < ox + ow && dy + dh > oy && dy < oy + oh) {
        // Hit!
        state = 'gameover';
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('neon-rex-hi', highScore);
        }
        spawnParticles(dino.x + dino.w / 2, groundY - dh / 2 + dino.y, C_RED, 15);
        try {
          window.parent.postMessage({ type: 'game-score', score, game: 'neon-rex' }, '*');
        } catch(e) {}
      }
    }

    // Particles
    particles = particles.filter(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.1;
      p.life -= p.decay;
      return p.life > 0;
    });
  }

  function drawDino() {
    const dh = dino.ducking ? DUCK_H : dino.h;
    const x = dino.x;
    const y = groundY - dh + dino.y;

    ctx.save();

    if (dino.ducking) {
      // Ducking dino - wider, shorter
      ctx.fillStyle = C_INK;
      // Body
      ctx.beginPath();
      ctx.roundRect(x, y + 4, 50, 22, 6);
      ctx.fill();
      // Head
      ctx.beginPath();
      ctx.roundRect(x + 35, y, 16, 16, 4);
      ctx.fill();
      // Eye
      ctx.fillStyle = C_BG;
      ctx.fillRect(x + 44, y + 4, 4, 4);
      // Legs
      ctx.fillStyle = C_INK;
      if (dino.legFrame === 0) {
        ctx.fillRect(x + 8, y + 24, 5, 6);
        ctx.fillRect(x + 22, y + 24, 5, 6);
      } else {
        ctx.fillRect(x + 14, y + 24, 5, 6);
        ctx.fillRect(x + 28, y + 24, 5, 6);
      }
    } else {
      // Standing dino
      ctx.fillStyle = C_INK;
      // Body
      ctx.beginPath();
      ctx.roundRect(x + 4, y + 12, 30, 24, 5);
      ctx.fill();
      // Head
      ctx.beginPath();
      ctx.roundRect(x + 14, y, 28, 20, 5);
      ctx.fill();
      // Jaw
      ctx.fillRect(x + 28, y + 12, 14, 8);
      // Eye
      ctx.fillStyle = C_BG;
      ctx.fillRect(x + 32, y + 5, 5, 5);
      // Tiny arms
      ctx.fillStyle = C_INK;
      ctx.fillRect(x + 24, y + 24, 8, 4);
      ctx.fillRect(x + 30, y + 26, 4, 5);
      // Tail
      ctx.fillRect(x, y + 16, 8, 6);
      ctx.fillRect(x - 4, y + 14, 6, 5);
      // Legs
      if (dino.jumping) {
        ctx.fillRect(x + 8, y + 36, 6, 12);
        ctx.fillRect(x + 22, y + 36, 6, 12);
      } else if (dino.legFrame === 0) {
        ctx.fillRect(x + 8, y + 36, 6, 12);
        ctx.fillRect(x + 22, y + 36, 6, 8);
      } else {
        ctx.fillRect(x + 8, y + 36, 6, 8);
        ctx.fillRect(x + 22, y + 36, 6, 12);
      }
    }

    ctx.restore();
  }

  function drawObstacle(o) {
    ctx.save();

    if (o.type === 'flyer') {
      const y = groundY - 30 - o.flyHeight;
      ctx.fillStyle = C_PURPLE;

      // Body
      ctx.beginPath();
      ctx.roundRect(o.x + 8, y + 8, 24, 12, 4);
      ctx.fill();
      // Head
      ctx.beginPath();
      ctx.roundRect(o.x + 28, y + 5, 12, 10, 3);
      ctx.fill();
      // Beak
      ctx.fillRect(o.x + 38, y + 8, 6, 4);
      // Eye
      ctx.fillStyle = C_BG;
      ctx.fillRect(o.x + 34, y + 7, 3, 3);
      // Wings
      ctx.fillStyle = C_PURPLE;
      if (o.wingFrame === 0) {
        ctx.beginPath();
        ctx.moveTo(o.x + 12, y + 8);
        ctx.lineTo(o.x + 22, y - 6);
        ctx.lineTo(o.x + 28, y + 8);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(o.x + 12, y + 20);
        ctx.lineTo(o.x + 22, y + 32);
        ctx.lineTo(o.x + 28, y + 20);
        ctx.fill();
      }
    } else {
      const y = groundY - o.h;
      let color = C_RED;
      if (o.type === 'tall') color = C_ORANGE;
      if (o.type === 'double') color = C_RED;

      ctx.fillStyle = color;

      if (o.type === 'double') {
        // Two crystals
        ctx.beginPath();
        ctx.roundRect(o.x, y + 5, 18, o.h - 5, 3);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(o.x + 26, y, 18, o.h, 3);
        ctx.fill();
        // Crystal tops
        ctx.beginPath();
        ctx.moveTo(o.x + 2, y + 5);
        ctx.lineTo(o.x + 9, y - 8);
        ctx.lineTo(o.x + 16, y + 5);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(o.x + 28, y);
        ctx.lineTo(o.x + 35, y - 12);
        ctx.lineTo(o.x + 42, y);
        ctx.fill();
      } else {
        // Single crystal pillar
        ctx.beginPath();
        ctx.roundRect(o.x, y + 8, o.w, o.h - 8, 3);
        ctx.fill();
        // Crystal top
        ctx.beginPath();
        ctx.moveTo(o.x, y + 8);
        ctx.lineTo(o.x + o.w / 2, y - 6);
        ctx.lineTo(o.x + o.w, y + 8);
        ctx.fill();
        // Inner highlight line
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(o.x + o.w / 2, y - 2);
        ctx.lineTo(o.x + o.w / 2, y + o.h);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function drawGround() {
    groundY = H() * 0.75;

    // Flat ground below the line
    ctx.fillStyle = C_SURFACE2;
    ctx.fillRect(0, groundY, W(), H() - groundY);

    // Short scrolling ground ticks (motion reference)
    ctx.strokeStyle = C_LINE;
    ctx.lineWidth = 2;
    for (let x = -groundOffset; x < W(); x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, groundY + 10);
      ctx.lineTo(x + 12, groundY + 10);
      ctx.stroke();
    }

    // Ground line
    ctx.strokeStyle = C_INK;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W(), groundY);
    ctx.stroke();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.textAlign = 'right';
    ctx.font = `700 22px ${FONT}`;
    ctx.fillStyle = C_INK;
    ctx.fillText(String(score).padStart(5, '0'), W() - 20, 35);

    ctx.font = `400 13px ${FONT}`;
    ctx.fillStyle = C_MUTED;
    ctx.fillText(`HI ${String(highScore).padStart(5, '0')}`, W() - 20, 55);
  }

  function drawMenu() {
    drawBg();

    ctx.textAlign = 'center';

    // Title
    ctx.font = `700 ${Math.min(64, W() * 0.13)}px ${FONT}`;
    ctx.fillStyle = C_INK;
    ctx.fillText('T-Rex', W() / 2, H() * 0.28);

    // Subtitle
    ctx.font = `400 18px ${FONT}`;
    ctx.fillStyle = C_MUTED;
    ctx.fillText('Spring, hoppa och ducka!', W() / 2, H() * 0.36);

    // Draw preview dino
    ctx.save();
    const previewX = W() / 2 - 22;
    const previewY = H() * 0.48;
    ctx.fillStyle = C_INK;
    ctx.beginPath();
    ctx.roundRect(previewX + 4, previewY + 12, 30, 24, 5);
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(previewX + 14, previewY, 28, 20, 5);
    ctx.fill();
    ctx.fillRect(previewX + 28, previewY + 12, 14, 8);
    ctx.fillStyle = C_BG;
    ctx.fillRect(previewX + 32, previewY + 5, 5, 5);
    ctx.fillStyle = C_INK;
    ctx.fillRect(previewX + 8, previewY + 36, 6, 12);
    ctx.fillRect(previewX + 22, previewY + 36, 6, 12);
    ctx.restore();

    // Controls
    ctx.font = `400 15px ${FONT}`;
    ctx.fillStyle = C_MUTED;
    ctx.fillText('Mellanslag / ↑ = Hoppa', W() / 2, H() * 0.65);
    ctx.fillText('↓ = Ducka', W() / 2, H() * 0.69);

    // High score
    if (highScore > 0) {
      ctx.font = `600 18px ${FONT}`;
      ctx.fillStyle = C_ACCENT;
      ctx.fillText(`Rekord: ${String(highScore).padStart(5, '0')}`, W() / 2, H() * 0.77);
    }

    // Play button
    const btnW = 200, btnH = 50;
    const bx = W() / 2 - btnW / 2, by = H() * 0.82;
    ctx.fillStyle = C_ACCENT;
    ctx.beginPath();
    ctx.roundRect(bx, by, btnW, btnH, 10);
    ctx.fill();

    ctx.fillStyle = C_SURFACE;
    ctx.font = `600 20px ${FONT}`;
    ctx.fillText('Spela', W() / 2, by + 32);
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(245,245,244,0.92)';
    ctx.fillRect(0, 0, W(), H());

    // Panel
    const pw = Math.min(320, W() - 32);
    const px = W() / 2 - pw / 2, py = H() * 0.2;
    const ph = H() * 0.65 + 50 + 24 - py;
    ctx.fillStyle = C_SURFACE;
    ctx.strokeStyle = C_LINE;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, 10);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'center';

    ctx.font = `700 ${Math.min(40, W() * 0.09)}px ${FONT}`;
    ctx.fillStyle = C_RED;
    ctx.fillText('Game over', W() / 2, H() * 0.32);

    ctx.font = `700 36px ${FONT}`;
    ctx.fillStyle = C_INK;
    ctx.fillText(String(score).padStart(5, '0'), W() / 2, H() * 0.45);

    ctx.font = `400 16px ${FONT}`;
    ctx.fillStyle = C_MUTED;
    ctx.fillText('Poäng', W() / 2, H() * 0.49);

    if (score >= highScore && score > 0) {
      ctx.font = `600 20px ${FONT}`;
      ctx.fillStyle = C_GREEN;
      ctx.fillText('Nytt rekord!', W() / 2, H() * 0.57);
    } else {
      ctx.font = `400 16px ${FONT}`;
      ctx.fillStyle = C_MUTED;
      ctx.fillText(`Rekord: ${String(highScore).padStart(5, '0')}`, W() / 2, H() * 0.57);
    }

    // Retry button
    const btnW = 200, btnH = 50;
    const bx = W() / 2 - btnW / 2, by = H() * 0.65;
    ctx.fillStyle = C_ACCENT;
    ctx.beginPath();
    ctx.roundRect(bx, by, btnW, btnH, 10);
    ctx.fill();

    ctx.fillStyle = C_SURFACE;
    ctx.font = `600 20px ${FONT}`;
    ctx.fillText('Försök igen', W() / 2, by + 32);
  }

  function drawBg() {
    // Flat background
    ctx.fillStyle = C_BG;
    ctx.fillRect(0, 0, W(), H());
    drawGround();
  }

  function draw() {
    ctx.clearRect(0, 0, W(), H());

    if (state === 'menu') {
      drawMenu();
    } else if (state === 'playing') {
      drawBg();
      for (const o of obstacles) drawObstacle(o);
      drawDino();
      drawParticles();
      drawHUD();
    } else if (state === 'gameover') {
      drawBg();
      for (const o of obstacles) drawObstacle(o);
      drawDino();
      drawParticles();
      drawGameOver();
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>

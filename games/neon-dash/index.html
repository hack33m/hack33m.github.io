<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dash</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f4;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  </style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<script>
// Run the game loop at 60 updates per second on every screen. The physics here is written
// per frame, so on 120 Hz and 144 Hz screens gravity, jumps and speed used to run 2x too fast.
(() => {
  const raf = window.requestAnimationFrame.bind(window);
  const STEP = 1000 / 60;
  let next = 0;
  window.requestAnimationFrame = cb => raf(function tick(t) {
    if (t < next - 1) return raf(tick);          // too early: wait for the next screen refresh
    next = (t - next > 250) ? t + STEP : next + STEP;  // stay on a 60 Hz beat, resync after pauses
    cb(t);
  });
})();
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.focus();
  window.addEventListener('load', () => canvas.focus());

  // --- Hi-DPI ---
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const W = () => window.innerWidth;
  const H = () => window.innerHeight;

  // --- Colors ---
  const BG = '#f5f5f4';
  const SURFACE = '#ffffff';
  const SURFACE2 = '#e7e5e4';
  const LINE = '#d6d3d1';
  const INK = '#1c1917';
  const MUTED = '#78716c';
  const ACCENT = '#2563eb';
  const RED = '#dc2626';
  const GREEN = '#16a34a';
  const YELLOW = '#ca8a04';
  const ORANGE = '#ea580c';
  const PURPLE = '#7c3aed';
  const TEAL = '#0d9488';
  const PINK = '#db2777';
  const FONT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  // Colours the rainbow skin steps through
  const RAINBOW_STEPS = [ACCENT, TEAL, GREEN, YELLOW, ORANGE, RED, PINK, PURPLE];

  // --- Skin System ---
  // Skin ids must stay as they are (the portal sends them). Colours are flat palette
  // values. `glow` is now only the thin outline colour; `glowStyle` is kept for the
  // rainbow skin and otherwise unused.
  const SKIN_DATA = {
    default:  { primary: '#2563eb', secondary: '#ffffff', trail: '#2563eb', glow: '#2563eb', glowStyle: 'normal' },
    crimson:  { primary: '#dc2626', secondary: '#ffffff', trail: '#dc2626', glow: '#dc2626', glowStyle: 'normal' },
    emerald:  { primary: '#16a34a', secondary: '#ffffff', trail: '#16a34a', glow: '#16a34a', glowStyle: 'normal' },
    sunset:   { primary: '#ea580c', secondary: '#ca8a04', trail: '#ea580c', glow: '#ea580c', glowStyle: 'normal' },
    phantom:  { primary: '#7c3aed', secondary: '#ffffff', trail: '#7c3aed', glow: '#7c3aed', glowStyle: 'pulse' },
    arctic:   { primary: '#92b1f5', secondary: '#ffffff', trail: '#92b1f5', glow: '#2563eb', glowStyle: 'frost' },
    golden:   { primary: '#ca8a04', secondary: '#ffffff', trail: '#ca8a04', glow: '#ca8a04', glowStyle: 'normal' },
    inferno:  { primary: '#ea580c', secondary: '#dc2626', trail: '#dc2626', glow: '#ea580c', glowStyle: 'flicker' },
    void:     { primary: '#1c1917', secondary: '#7c3aed', trail: '#7c3aed', glow: '#1c1917', glowStyle: 'reverse' },
    rainbow:  { primary: 'rainbow', secondary: '#ffffff', trail: 'rainbow', glow: 'rainbow', glowStyle: 'rainbow' },
    'corny-choklad':  { primary: '#1c1917', secondary: '#ca8a04', trail: '#78716c', glow: '#1c1917', glowStyle: 'normal' },
    'corny-mork':     { primary: '#1c1917', secondary: '#78716c', trail: '#1c1917', glow: '#1c1917', glowStyle: 'normal' },
    'corny-vit':      { primary: '#ffffff', secondary: '#ca8a04', trail: '#d6d3d1', glow: '#1c1917', glowStyle: 'normal' },
    'corny-kokos':    { primary: '#ffffff', secondary: '#78716c', trail: '#d6d3d1', glow: '#1c1917', glowStyle: 'normal' },
    'corny-banan':    { primary: '#ca8a04', secondary: '#1c1917', trail: '#ca8a04', glow: '#ca8a04', glowStyle: 'normal' },
    'corny-jordnot':  { primary: '#e4c481', secondary: '#78716c', trail: '#ca8a04', glow: '#ca8a04', glowStyle: 'normal' },
    'corny-jordgubb': { primary: '#db2777', secondary: '#ffffff', trail: '#db2777', glow: '#db2777', glowStyle: 'normal' },
    'corny-brownie':  { primary: '#1c1917', secondary: '#ea580c', trail: '#78716c', glow: '#1c1917', glowStyle: 'normal' },
    'corny-karamell': { primary: '#ea580c', secondary: '#ffffff', trail: '#ea580c', glow: '#ea580c', glowStyle: 'normal' },
  };

  // --- Corny Images ---
  const cornyImages = {};
  function loadCornyImg(id, filename) {
    const img = new Image();
    img._loaded = false;
    const paths = ['../../images/' + filename, '/images/' + filename];
    let idx = 0;
    img.onload = () => { img._loaded = true; };
    img.onerror = () => { idx++; if (idx < paths.length) img.src = paths[idx]; };
    img.src = paths[0];
    cornyImages[id] = img;
  }
  loadCornyImg('corny-choklad', 'corny-choklad.png');
  loadCornyImg('corny-mork', 'corny-mork.png');
  loadCornyImg('corny-vit', 'corny-vit.png');
  loadCornyImg('corny-kokos', 'corny-kokos.png');
  loadCornyImg('corny-banan', 'corny-banan.png');
  loadCornyImg('corny-jordnot', 'corny-jordnot.png');
  loadCornyImg('corny-jordgubb', 'corny-jordgubb.png');
  loadCornyImg('corny-brownie', 'corny-brownie.png');
  loadCornyImg('corny-karamell', 'corny-karamell.png');

  let skinPrimary = ACCENT;
  let skinSecondary = '#ffffff';
  let skinTrail = ACCENT;
  let skinGlow = ACCENT;
  let skinGlowStyle = 'normal';

  let _equippedSkinId = 'default';
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'skin-data') {
      _equippedSkinId = e.data.skinId || 'default';
      loadSkin();
    }
  });

  function getEquippedSkinId() {
    return _equippedSkinId;
  }

  function loadSkin() {
    const id = getEquippedSkinId();
    const skin = SKIN_DATA[id] || SKIN_DATA.default;
    skinGlowStyle = skin.glowStyle;
    if (skin.primary === 'rainbow') {
      // Step calmly through the palette instead of a saturated hue cycle
      const step = Math.floor(Date.now() / 600) % RAINBOW_STEPS.length;
      skinPrimary = RAINBOW_STEPS[step];
      skinSecondary = '#ffffff';
      skinTrail = RAINBOW_STEPS[(step + 1) % RAINBOW_STEPS.length];
      skinGlow = RAINBOW_STEPS[step];
    } else {
      skinPrimary = skin.primary;
      skinSecondary = skin.secondary;
      skinTrail = skin.trail;
      skinGlow = skin.glow;
    }
  }

  // ========== GAME STATES ==========
  const STATE = { MENU: 0, MODE_SELECT: 1, PLAYING: 2, DEAD: 3 };
  let state = STATE.MENU;

  // ========== GAME MODES ==========
  const MODE = { WAVE: 'wave', SHIP: 'ship', BALL: 'ball', UFO: 'ufo', SWING: 'swing', SPIDER: 'spider', ROBOT: 'robot', CUBE: 'cube', MIXED: 'mixed' };
  let gameMode = MODE.WAVE;
  let selectedModeIndex = 0;

  const MODE_LIST = [
    { id: MODE.WAVE,  label: 'Wave',  icon: '〰', color: ACCENT, desc: 'Zigzag-kontroll' },
    { id: MODE.SHIP,  label: 'Ship',  icon: '▲', color: GREEN,  desc: 'Flyg med momentum' },
    { id: MODE.BALL,  label: 'Ball',  icon: '●', color: PURPLE, desc: 'Vänd gravitation' },
    { id: MODE.UFO,   label: 'UFO',   icon: '◎', color: ORANGE, desc: 'Tryck för boost' },
    { id: MODE.SWING, label: 'Swing', icon: '⌁', color: PINK,   desc: 'Pendel-fysik' },
    { id: MODE.SPIDER, label: 'Spider', icon: '🕷', color: RED,  desc: 'Teleportera mellan ytor' },
    { id: MODE.ROBOT, label: 'Robot', icon: '🤖', color: TEAL,  desc: 'Håll för högre hopp' },
    { id: MODE.CUBE,  label: 'Cube',  icon: '■', color: YELLOW, desc: 'Klassiskt hopp' },
    { id: MODE.MIXED, label: 'Mixed', icon: '🌀', color: INK, desc: 'Alla lägen med portaler' },
  ];

  // Sub-modes available in mixed mode (all except mixed itself)
  const MIXED_SUB_MODES = [MODE.CUBE, MODE.SHIP, MODE.WAVE, MODE.BALL, MODE.UFO, MODE.SWING, MODE.SPIDER, MODE.ROBOT];

  // ========== GAME VARIABLES ==========
  let score = 0;
  function getHighScoreKey() { return 'neondash-hs-' + (isMixedMode ? 'mixed' : gameMode); }
  function getHighScore() { return parseInt(localStorage.getItem(getHighScoreKey()) || '0'); }
  function setHighScore(v) { localStorage.setItem(getHighScoreKey(), v.toString()); }
  function getOverallBest() {
    let best = 0;
    for (const m of MODE_LIST) best = Math.max(best, parseInt(localStorage.getItem('neondash-hs-' + m.id) || '0'));
    return best;
  }
  let lastRunRecord = '';   // '' = no record, 'overall' = best in any mode, 'mode' = best in this mode only
  let holding = false;
  let tapped = false; // single-tap detection for ball/ufo/swing
  let gameSpeed = 3.5;
  let baseSpeed = 3.5;
  let distance = 0;
  let shakeTimer = 0;
  let flashTimer = 0;
  let deathParticles = [];
  let menuPulse = 0;
  let gravityDir = 1; // 1 = down, -1 = up (for ball/swing)
  let isMixedMode = false;
  let mixedObstacleCount = 0; // obstacles since last portal
  let portalFlashTimer = 0;
  let portalFlashMode = ''; // mode label to show on portal switch
  let mixedTargetSpeed = 0; // speed to ramp back up to after portal switch

  // Player
  const player = {
    x: 0, y: 0, vy: 0,
    size: 14,
    trail: [],  // {x, y} positions
    alive: true
  };

  // World
  let obstacles = [];

  // Tunnel
  const TUNNEL_MARGIN = 65;
  const tunnelTop = () => TUNNEL_MARGIN;
  const tunnelBottom = () => H() - TUNNEL_MARGIN;
  const tunnelHeight = () => tunnelBottom() - tunnelTop();

  // ========== HELPERS ==========
  function hexToRgba(hex, a) {
    if (hex.startsWith('hsl')) return hex.replace(')', `, ${a})`).replace('hsl(', 'hsla(');
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  // ========== INIT ==========
  function initPlayer() {
    player.x = W() * 0.18;
    player.y = H() / 2;
    player.vy = 0;
    player.trail = [];
    player.alive = true;
    player.chargeTime = 0;
  }

  // ========== OBSTACLE GENERATION ==========
  // Track the last safe zone so next obstacle is always reachable
  let lastSafeY = 0;      // center of last safe passage
  let lastObstacleX = 0;  // x position of last obstacle

  function generateEndlessObstacle(x) {
    const difficulty = Math.min(distance / 3500, 1);
    const tH = tunnelHeight();
    const tTop = tunnelTop();
    const tBot = tunnelBottom();
    const ps = player.size;
    const colPS = ps * 0.6; // collision radius (must match checkCollision)

    // Minimum safe gap the player can fit through (generous)
    const MIN_GAP = ps * 7;

    // How far can the player move vertically between obstacles?
    // Use 0.7x because player may need to change direction mid-flight
    const horizDist = x - lastObstacleX;
    const verticalReach = horizDist > 0 ? horizDist * 0.7 : tH;

    let type;
    const roll = Math.random();

    // Mode-specific obstacle distribution
    switch (gameMode) {
      case MODE.WAVE:
        // Tight zigzag: lots of gaps and spikes
        if (difficulty < 0.2) {
          type = roll < 0.55 ? 'gap' : (roll < 0.8 ? 'spikes_top' : 'spikes_bottom');
        } else if (difficulty < 0.5) {
          type = roll < 0.3 ? 'gap' : (roll < 0.5 ? 'spikes_top' : (roll < 0.7 ? 'spikes_bottom' : (roll < 0.85 ? 'spikes_both' : 'pillars')));
        } else {
          const wt = ['gap', 'spikes_top', 'spikes_bottom', 'spikes_both', 'pillars'];
          type = wt[Math.floor(Math.random() * wt.length)];
        }
        break;
      case MODE.SHIP:
        // Momentum flight: more open gaps, spikes on one side, pillars
        if (difficulty < 0.3) {
          type = roll < 0.4 ? 'gap' : (roll < 0.7 ? 'spikes_top' : 'spikes_bottom');
        } else {
          type = roll < 0.25 ? 'gap' : (roll < 0.45 ? 'spikes_top' : (roll < 0.65 ? 'spikes_bottom' : (roll < 0.8 ? 'pillars' : 'spikes_both')));
        }
        break;
      case MODE.BALL:
        // Gravity flip: only spikes on one surface at a time (safe on the other)
        if (difficulty < 0.3) {
          type = roll < 0.5 ? 'spikes_bottom' : 'spikes_top';
        } else {
          type = roll < 0.4 ? 'spikes_bottom' : (roll < 0.8 ? 'spikes_top' : 'pillars');
        }
        break;
      case MODE.UFO:
        // Flappy-style: mostly vertical walls with gaps
        if (difficulty < 0.3) {
          type = roll < 0.7 ? 'gap' : (roll < 0.85 ? 'spikes_top' : 'spikes_bottom');
        } else {
          type = roll < 0.5 ? 'gap' : (roll < 0.65 ? 'spikes_top' : (roll < 0.8 ? 'spikes_bottom' : (roll < 0.9 ? 'pillars' : 'spikes_both')));
        }
        break;
      case MODE.SWING:
        // Pendulum: wider passages, more pillars to weave around
        if (difficulty < 0.3) {
          type = roll < 0.35 ? 'gap' : (roll < 0.65 ? 'pillars' : (roll < 0.85 ? 'spikes_top' : 'spikes_bottom'));
        } else {
          type = roll < 0.25 ? 'gap' : (roll < 0.55 ? 'pillars' : (roll < 0.7 ? 'spikes_top' : (roll < 0.85 ? 'spikes_bottom' : 'spikes_both')));
        }
        break;
      case MODE.SPIDER:
        // Surface teleport: only spikes on one surface at a time (always safe on the other)
        if (difficulty < 0.3) {
          type = roll < 0.5 ? 'spikes_bottom' : 'spikes_top';
        } else {
          type = roll < 0.4 ? 'spikes_bottom' : (roll < 0.8 ? 'spikes_top' : 'pillars');
        }
        break;
      case MODE.ROBOT:
        // jump from floor: floor spikes, pillars, and ceiling spikes to force short hops
        if (difficulty < 0.3) {
          type = roll < 0.5 ? 'spikes_bottom' : (roll < 0.85 ? 'pillars' : 'spikes_top');
        } else {
          type = roll < 0.35 ? 'spikes_bottom' : (roll < 0.6 ? 'pillars' : 'spikes_top');
        }
        break;
      case MODE.CUBE:
        // Classic jump: only floor spikes and floor pillars
        if (difficulty < 0.3) {
          type = roll < 0.55 ? 'spikes_bottom' : 'pillars';
        } else {
          type = roll < 0.45 ? 'spikes_bottom' : 'pillars';
        }
        break;
      default:
        type = roll < 0.4 ? 'gap' : (roll < 0.6 ? 'spikes_top' : (roll < 0.8 ? 'spikes_bottom' : 'pillars'));
    }

    // Calculate reachable Y range from last safe position
    const reachMin = Math.max(tTop + colPS, lastSafeY - verticalReach);
    const reachMax = Math.min(tBot - colPS, lastSafeY + verticalReach);

    let ob;

    switch (type) {
      case 'gap': {
        // Mode-specific gap sizes
        let baseGap = 160, gapShrink = 40;
        switch (gameMode) {
          case MODE.WAVE:  baseGap = 155; gapShrink = 38; break;
          case MODE.SHIP:  baseGap = 180; gapShrink = 35; break;
          case MODE.BALL:  baseGap = 190; gapShrink = 30; break;
          case MODE.UFO:   baseGap = 170; gapShrink = 35; break;
          case MODE.SWING:  baseGap = 200; gapShrink = 30; break;
          case MODE.SPIDER: baseGap = 195; gapShrink = 25; break;
          case MODE.ROBOT:  baseGap = 210; gapShrink = 25; break;
          case MODE.CUBE:   baseGap = 200; gapShrink = 25; break;
        }
        const gapSize = Math.max(MIN_GAP, baseGap - gapShrink * difficulty);
        // Place gap center within reachable range
        const gapMin = Math.max(tTop + gapSize / 2, reachMin);
        const gapMax = Math.min(tBot - gapSize / 2, reachMax);
        const gapY = gapMin + Math.random() * Math.max(0, gapMax - gapMin);
        ob = { type: 'gap', x, width: 28 + Math.random() * 18, gapY, gapSize, color: INK };
        lastSafeY = gapY;
        break;
      }
      case 'spikes_top': {
        // Player survives when: py - colPS >= tTop + spikeHeight
        // So safe zone starts at tTop + spikeHeight + colPS
        // Max spike height: player must be able to reach below the spikes
        const maxReachable = reachMax - colPS - tTop;
        // Ground modes (cube/robot) get shorter spikes they can jump over
        const groundMode = (gameMode === MODE.CUBE || gameMode === MODE.ROBOT);
        const spikeScale = groundMode ? 0.12 : 0.2;
        const desiredH = (0.15 + Math.random() * spikeScale * (1 + difficulty * 0.5)) * tH;
        const h = Math.max(20, Math.min(desiredH, tH - MIN_GAP, maxReachable));
        ob = { type: 'spikes_top', x, width: 45 + Math.random() * 25, spikeHeight: h, color: RED };
        // Safe position: just below the spikes (with margin)
        lastSafeY = Math.max(reachMin, Math.min(reachMax, tTop + h + colPS + MIN_GAP / 3));
        break;
      }
      case 'spikes_bottom': {
        // Player survives when: py + colPS <= tBot - spikeHeight
        // So safe zone ends at tBot - spikeHeight - colPS
        const maxReachable = tBot - reachMin - colPS;
        // Ground modes get shorter spikes (jumpable height)
        const groundMode2 = (gameMode === MODE.CUBE || gameMode === MODE.ROBOT);
        const spikeScale2 = groundMode2 ? 0.1 : 0.2;
        const desiredH = (0.1 + Math.random() * spikeScale2 * (1 + difficulty * 0.5)) * tH;
        const h = Math.max(15, Math.min(desiredH, tH - MIN_GAP, maxReachable));
        ob = { type: 'spikes_bottom', x, width: groundMode2 ? 30 + Math.random() * 20 : 45 + Math.random() * 25, spikeHeight: h, color: RED };
        // Safe position: just above the spikes (with margin)
        lastSafeY = Math.max(reachMin, Math.min(reachMax, tBot - h - colPS - MIN_GAP / 3));
        break;
      }
      case 'spikes_both': {
        // Player survives when: py - colPS >= tTop + topH AND py + colPS <= tBot - botH
        // Safe zone: [tTop + topH + colPS, tBot - botH - colPS]
        const maxEach = (tH - MIN_GAP) / 2;
        let topH = Math.min((0.1 + Math.random() * 0.12 * (1 + difficulty * 0.3)) * tH, maxEach);
        let botH = Math.min((0.1 + Math.random() * 0.12 * (1 + difficulty * 0.3)) * tH, maxEach);
        // Ensure safe zone overlaps with reachable range
        let safeTop = tTop + topH + colPS;
        let safeBot = tBot - botH - colPS;
        // If safe zone doesn't overlap with reachable range, shrink spikes
        if (safeTop > reachMax || safeBot < reachMin) {
          topH = Math.max(10, reachMin - tTop - colPS);
          botH = Math.max(10, tBot - reachMax - colPS);
          if (topH < 10) topH = 10;
          if (botH < 10) botH = 10;
          safeTop = tTop + topH + colPS;
          safeBot = tBot - botH - colPS;
        }
        // Double check: remaining gap
        const remaining = tH - topH - botH;
        if (remaining < MIN_GAP) {
          const scale = (tH - MIN_GAP) / (topH + botH);
          topH *= scale;
          botH *= scale;
        }
        ob = { type: 'spikes_both', x, width: 45 + Math.random() * 20,
          topHeight: topH, bottomHeight: botH, color: ORANGE };
        // Safe zone is the middle of the gap
        const gapCenter = tTop + ob.topHeight + colPS + (tH - ob.topHeight - ob.bottomHeight - colPS * 2) / 2;
        lastSafeY = Math.max(reachMin, Math.min(reachMax, gapCenter));
        break;
      }
      case 'pillars': {
        // Ground/surface modes: pillars grow from floor or ceiling
        const isGroundPillar = (gameMode === MODE.CUBE || gameMode === MODE.ROBOT);
        const isSurfacePillar = (gameMode === MODE.BALL || gameMode === MODE.SPIDER);
        const pillarH = (isGroundPillar || isSurfacePillar) ? 25 + Math.random() * 35 : 35 + Math.random() * 30;
        const pillarW = (isGroundPillar || isSurfacePillar) ? 18 + Math.random() * 12 : 22 + Math.random() * 10;

        // Place pillar so the safe passage is within reach
        let py;
        if (isGroundPillar) {
          // Pillar rises from floor, so the player must jump over
          py = tBot - pillarH;
          lastSafeY = Math.max(reachMin, Math.min(reachMax, py - colPS - MIN_GAP / 3));
        } else if (isSurfacePillar) {
          // Pillar from floor or ceiling: player flips/teleports to other surface
          if (Math.random() < 0.5) {
            py = tBot - pillarH;
            lastSafeY = Math.max(reachMin, Math.min(reachMax, tTop + colPS + MIN_GAP / 3));
          } else {
            py = tTop;
            lastSafeY = Math.max(reachMin, Math.min(reachMax, tBot - colPS - MIN_GAP / 3));
          }
        } else if (lastSafeY < tTop + tH / 2) {
          // Player is in upper half: place pillar below player, safe zone above
          const minPy = Math.max(tTop + 10, lastSafeY + colPS + MIN_GAP / 2);
          py = minPy + Math.random() * Math.max(0, tBot - pillarH - 10 - minPy);
          lastSafeY = Math.max(reachMin, Math.min(reachMax, py - colPS - MIN_GAP / 3));
        } else {
          // Player is in lower half: place pillar above player, safe zone below
          const maxPy = Math.min(tBot - pillarH - 10, lastSafeY - colPS - MIN_GAP / 2);
          py = tTop + 10 + Math.random() * Math.max(0, maxPy - tTop - 10);
          lastSafeY = Math.max(reachMin, Math.min(reachMax, py + pillarH + colPS + MIN_GAP / 3));
        }

        ob = { type: 'pillars', x, width: pillarW, pillars: [{ offsetX: 0, y: py, height: pillarH, width: pillarW }], color: INK };
        break;
      }
    }

    lastObstacleX = x;
    return ob;
  }

  // Mode-specific obstacle spacing
  function getModeSpacing() {
    switch (gameMode) {
      case MODE.WAVE:  return { base: 250, rand: 150, shrink: 0.003, maxShrink: 40, floor: 210 };
      case MODE.SHIP:  return { base: 280, rand: 160, shrink: 0.002, maxShrink: 35, floor: 240 };
      case MODE.BALL:  return { base: 220, rand: 120, shrink: 0.003, maxShrink: 30, floor: 190 };
      case MODE.UFO:   return { base: 300, rand: 140, shrink: 0.002, maxShrink: 40, floor: 250 };
      case MODE.SWING:  return { base: 320, rand: 160, shrink: 0.002, maxShrink: 35, floor: 270 };
      case MODE.SPIDER: return { base: 260, rand: 140, shrink: 0.002, maxShrink: 35, floor: 220 };
      case MODE.ROBOT:  return { base: 300, rand: 160, shrink: 0.002, maxShrink: 30, floor: 260 };
      case MODE.CUBE:   return { base: 280, rand: 150, shrink: 0.002, maxShrink: 30, floor: 240 };
      default: return { base: 250, rand: 150, shrink: 0.003, maxShrink: 40, floor: 210 };
    }
  }

  function generateInitialEndless() {
    lastSafeY = H() / 2;
    lastObstacleX = W() * 0.2;
    const sp = getModeSpacing();
    let x = W() * 0.7;
    while (x < W() * 3) {
      obstacles.push(generateEndlessObstacle(x));
      x += sp.base + Math.random() * sp.rand;
    }
  }

  // ========== RESET ==========
  function startGame(mode) {
    isMixedMode = (mode === MODE.MIXED);
    mixedObstacleCount = 0;
    portalFlashTimer = 0;
    portalFlashMode = '';

    if (isMixedMode) {
      gameMode = MIXED_SUB_MODES[Math.floor(Math.random() * MIXED_SUB_MODES.length)];
    } else {
      gameMode = mode;
    }

    score = 0;
    distance = 0;
    deathParticles = [];
    shakeTimer = 0;
    flashTimer = 0;
    obstacles = [];
    gravityDir = 1;
    tapped = false;

    // Mode-specific base speeds
    function getBaseSpeed(m) {
      switch (m) {
        case MODE.WAVE:  return 3.5;
        case MODE.SHIP:  return 3.2;
        case MODE.BALL:  return 3.8;
        case MODE.UFO:   return 3.0;
        case MODE.SWING:  return 3.0;
        case MODE.SPIDER: return 3.5;
        case MODE.ROBOT:  return 3.2;
        case MODE.CUBE:   return 3.5;
        default: return 3.5;
      }
    }
    baseSpeed = getBaseSpeed(gameMode);
    gameSpeed = baseSpeed;
    generateInitialEndless();

    initPlayer();
    // Floor-based modes start on the floor
    if (gameMode === MODE.BALL || gameMode === MODE.SPIDER || gameMode === MODE.ROBOT || gameMode === MODE.CUBE) {
      player.y = tunnelBottom() - player.size;
      player.vy = 0;
    }
    loadSkin();
    state = STATE.PLAYING;
  }

  // Switch to a new sub-mode during mixed play
  function switchMixedMode(newMode) {
    const tTop = tunnelTop();
    const tBot = tunnelBottom();
    gameMode = newMode;

    // Clear obstacles ahead of player so old mode's obstacles don't block new mode
    obstacles = obstacles.filter(ob => ob.x < player.x + 50);

    // Reset gravity for non-gravity modes
    gravityDir = 1;
    player.vy = 0;
    player.chargeTime = 0;

    // Position player based on new mode
    const floorModes = [MODE.BALL, MODE.SPIDER, MODE.ROBOT, MODE.CUBE];
    if (floorModes.includes(newMode)) {
      player.y = tBot - player.size;
    } else {
      // Center for flying modes, clamped to tunnel
      player.y = Math.max(tTop + player.size, Math.min(tBot - player.size, player.y));
    }

    // Update base speed for new mode
    switch (newMode) {
      case MODE.WAVE:  baseSpeed = 3.5; break;
      case MODE.SHIP:  baseSpeed = 3.2; break;
      case MODE.BALL:  baseSpeed = 3.8; break;
      case MODE.UFO:   baseSpeed = 3.0; break;
      case MODE.SWING:  baseSpeed = 3.0; break;
      case MODE.SPIDER: baseSpeed = 3.5; break;
      case MODE.ROBOT:  baseSpeed = 3.2; break;
      case MODE.CUBE:   baseSpeed = 3.5; break;
    }

    // Slow down on portal switch, then ramp back up
    mixedTargetSpeed = gameSpeed;
    gameSpeed = baseSpeed;

    // Flash the mode name
    portalFlashTimer = 60;
    const info = MODE_LIST.find(m => m.id === newMode);
    portalFlashMode = info ? info.label : newMode;
  }

  // ========== INPUT ==========
  let lastScreenChange = 0;
  const SCREEN_DELAY = 400; // ms; ignore clicks for 400ms after screen change

  function screenReady() {
    return Date.now() - lastScreenChange > SCREEN_DELAY;
  }

  function goToModeSelect() {
    state = STATE.MODE_SELECT;
    selectedModeIndex = 0;
    lastScreenChange = Date.now();
  }

  function selectMode(idx) {
    selectedModeIndex = idx;
    startGame(MODE_LIST[idx].id);
  }

  // Gameplay hold/release
  function onDown(e) {
    if (e) e.preventDefault();
    canvas.focus();
    holding = true;
    tapped = true;
  }

  function onUp(e) {
    if (e) e.preventDefault();
    holding = false;
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchend', onUp, { passive: false });

  // Screen transitions: shared handler for click and tap
  function handleScreenTap(clientX, clientY) {
    if (!screenReady()) return;

    if (state === STATE.MENU) {
      goToModeSelect();
      return;
    }

    if (state === STATE.DEAD && shakeTimer <= 0) {
      goToModeSelect();
      return;
    }

    if (state === STATE.MODE_SELECT) {
      const cards = getModeCardLayout();
      for (let i = 0; i < cards.length; i++) {
        const c = cards[i];
        if (clientX >= c.x && clientX <= c.x + c.w && clientY >= c.y && clientY <= c.y + c.h) {
          selectMode(i);
          return;
        }
      }
    }
  }

  canvas.addEventListener('click', (e) => {
    handleScreenTap(e.clientX, e.clientY);
  });

  // Touch tap (touchend fires even when click is prevented)
  let touchStartPos = null;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStartPos = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    if (!touchStartPos) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartPos.x;
    const dy = t.clientY - touchStartPos.y;
    // Only count as tap if finger didn't move much
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
      handleScreenTap(t.clientX, t.clientY);
    }
    touchStartPos = null;
  }, { passive: true });

  // Keyboard
  function handleKeyDown(e) {
    // Gameplay hold
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (!e.repeat) { holding = true; tapped = true; }
    }

    if (!screenReady()) return;

    // Screen transitions on Space/Enter
    if (e.code === 'Space' || e.code === 'Enter') {
      if (state === STATE.MENU) { goToModeSelect(); return; }
      if (state === STATE.DEAD && shakeTimer <= 0) { goToModeSelect(); return; }
    }

    // Mode select navigation
    if (state === STATE.MODE_SELECT) {
      const items = MODE_LIST;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        e.preventDefault();
        selectedModeIndex = (selectedModeIndex - 1 + items.length) % items.length;
      }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        e.preventDefault();
        selectedModeIndex = (selectedModeIndex + 1) % items.length;
      }
      if (e.code === 'Enter') {
        e.preventDefault();
        selectMode(selectedModeIndex);
      }
    }
  }

  function handleKeyUp(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      holding = false;
    }
  }

  canvas.addEventListener('keydown', handleKeyDown);
  canvas.addEventListener('keyup', handleKeyUp);
  document.addEventListener('keydown', handleKeyDown);
  document.addEventListener('keyup', handleKeyUp);

  // ========== COLLISION ==========
  function checkCollision() {
    const px = player.x, py = player.y, ps = player.size * 0.6;

    // NO wall death, walls just clamp
    for (const ob of obstacles) {
      if (ob.type === 'finish' || ob.type === 'portal') continue;
      switch (ob.type) {
        case 'gap':
          if (px + ps > ob.x && px - ps < ob.x + ob.width) {
            if (py - ps < ob.gapY - ob.gapSize / 2 || py + ps > ob.gapY + ob.gapSize / 2) return true;
          }
          break;
        case 'spikes_top':
          if (px + ps > ob.x && px - ps < ob.x + ob.width) {
            if (py - ps < tunnelTop() + ob.spikeHeight) return true;
          }
          break;
        case 'spikes_bottom':
          if (px + ps > ob.x && px - ps < ob.x + ob.width) {
            if (py + ps > tunnelBottom() - ob.spikeHeight) return true;
          }
          break;
        case 'spikes_both':
          if (px + ps > ob.x && px - ps < ob.x + ob.width) {
            if (py - ps < tunnelTop() + ob.topHeight || py + ps > tunnelBottom() - ob.bottomHeight) return true;
          }
          break;
        case 'pillars':
          for (const pil of ob.pillars) {
            const pilX = ob.x + pil.offsetX;
            if (px + ps > pilX && px - ps < pilX + pil.width) {
              if (py + ps > pil.y && py - ps < pil.y + pil.height) return true;
            }
          }
          break;
      }
    }
    return false;
  }

  // ========== DEATH ==========
  function die() {
    player.alive = false;
    state = STATE.DEAD;
    shakeTimer = 20;
    flashTimer = 8;
    lastRunRecord = score > getOverallBest() ? 'overall' : score > getHighScore() ? 'mode' : '';
    if (score > getHighScore()) {
      setHighScore(score);
    }
    // Send score to parent for coin rewards
    if (score > 0 && window.parent !== window) {
      window.parent.postMessage({ type: 'game-score', score: score }, '*');
    }
    for (let i = 0; i < 16; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      deathParticles.push({
        x: player.x, y: player.y,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        size: Math.random() * 3 + 2, life: 1,
        decay: Math.random() * 0.03 + 0.01, color: skinPrimary
      });
    }
  }

  // ========== DRAWING ==========

  function drawBackground() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W(), H());

    // Very faint scrolling grid inside the tunnel (speed reference)
    ctx.strokeStyle = SURFACE2;
    ctx.lineWidth = 1;
    const gridSize = 50;
    const offsetX = (distance * 0.5) % gridSize;
    for (let x = -offsetX; x < W(); x += gridSize) {
      ctx.beginPath(); ctx.moveTo(x, tunnelTop()); ctx.lineTo(x, tunnelBottom()); ctx.stroke();
    }
    for (let y = tunnelTop(); y <= tunnelBottom(); y += gridSize) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W(), y); ctx.stroke();
    }

    // Outside the tunnel
    ctx.fillStyle = SURFACE2;
    ctx.fillRect(0, 0, W(), tunnelTop());
    ctx.fillRect(0, tunnelBottom(), W(), H() - tunnelBottom());

    // Tunnel borders
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, tunnelTop()); ctx.lineTo(W(), tunnelTop()); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, tunnelBottom()); ctx.lineTo(W(), tunnelBottom()); ctx.stroke();
  }

  // --- Obstacles ---
  function drawSpikesTop(x, width, height, color) {
    const spikeW = width / 3;
    ctx.fillStyle = color;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * spikeW, tunnelTop());
      ctx.lineTo(x + i * spikeW + spikeW / 2, tunnelTop() + height);
      ctx.lineTo(x + (i + 1) * spikeW, tunnelTop());
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillRect(x, tunnelTop(), width, 3);
  }

  function drawSpikesBottom(x, width, height, color) {
    const spikeW = width / 3;
    ctx.fillStyle = color;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * spikeW, tunnelBottom());
      ctx.lineTo(x + i * spikeW + spikeW / 2, tunnelBottom() - height);
      ctx.lineTo(x + (i + 1) * spikeW, tunnelBottom());
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillRect(x, tunnelBottom() - 3, width, 3);
  }

  function drawObstacles() {
    for (const ob of obstacles) {
      if (ob.type === 'finish') {
        // Finish line
        ctx.strokeStyle = GREEN;
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 8]);
        ctx.beginPath(); ctx.moveTo(ob.x, tunnelTop()); ctx.lineTo(ob.x, tunnelBottom()); ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = GREEN;
        ctx.font = `600 14px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.fillText('Mål', ob.x, tunnelTop() - 10);
        continue;
      }

      if (ob.type === 'portal') {
        const cx = ob.x + ob.width / 2;
        const cy = (tunnelTop() + tunnelBottom()) / 2;
        const r = 28;
        const col = ob.color;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        switch (ob.targetMode) {
          case MODE.WAVE: {
            // Zigzag gate
            ctx.strokeStyle = col;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-8, -r); ctx.lineTo(8, -r * 0.5); ctx.lineTo(-8, 0); ctx.lineTo(8, r * 0.5); ctx.lineTo(-8, r);
            ctx.stroke();
            break;
          }
          case MODE.SHIP: {
            // Rocket/triangle portal
            ctx.fillStyle = hexToRgba(col, 0.15);
            ctx.beginPath();
            ctx.moveTo(r * 0.8, 0); ctx.lineTo(-r * 0.6, -r); ctx.lineTo(-r * 0.6, r); ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = col;
            ctx.lineWidth = 2;
            ctx.stroke();
            break;
          }
          case MODE.BALL: {
            // Double circle (gravity flip)
            ctx.strokeStyle = col;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, -r * 0.35, r * 0.45, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, r * 0.35, r * 0.45, 0, Math.PI * 2); ctx.stroke();
            // Arrow between
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.lineTo(0, -6); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.lineTo(0, 6); ctx.closePath(); ctx.fill();
            break;
          }
          case MODE.UFO: {
            // UFO dome shape
            ctx.fillStyle = hexToRgba(col, 0.15);
            ctx.beginPath(); ctx.ellipse(0, 4, r * 0.9, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = col;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.ellipse(0, 4, r * 0.9, r * 0.3, 0, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, -4, r * 0.45, Math.PI, 0); ctx.stroke();
            break;
          }
          case MODE.SWING: {
            // Pendulum arc
            ctx.strokeStyle = col;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, -r * 1.2, r * 1.5, Math.PI * 0.35, Math.PI * 0.65); ctx.stroke();
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.arc(0, r * 0.4, 5, 0, Math.PI * 2); ctx.fill();
            // String
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(0, -r * 0.3); ctx.lineTo(0, r * 0.35); ctx.stroke();
            break;
          }
          case MODE.SPIDER: {
            // Web/X shape
            ctx.strokeStyle = col;
            ctx.lineWidth = 2;
            for (let a = 0; a < 4; a++) {
              const ang = a * Math.PI / 4 + Math.PI / 8;
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
              ctx.stroke();
            }
            // Inner ring
            ctx.beginPath(); ctx.arc(0, 0, r * 0.4, 0, Math.PI * 2); ctx.stroke();
            break;
          }
          case MODE.ROBOT: {
            // Square with antenna
            ctx.strokeStyle = col;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(-r * 0.55, -r * 0.4, r * 1.1, r * 0.9, 6); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -r * 0.4); ctx.lineTo(0, -r * 0.75); ctx.stroke();
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.arc(0, -r * 0.8, 3, 0, Math.PI * 2); ctx.fill();
            break;
          }
          case MODE.CUBE: {
            // Square outline
            ctx.strokeStyle = col;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(-r * 0.55, -r * 0.55, r * 1.1, r * 1.1, 6); ctx.stroke();
            // Inner dot
            ctx.fillStyle = col;
            ctx.fillRect(-4, -4, 8, 8);
            break;
          }
          default: {
            // Fallback: simple ring
            ctx.strokeStyle = col;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2); ctx.stroke();
          }
        }

        // Mode name below portal
        ctx.fillStyle = col;
        ctx.font = `600 11px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.fillText(ob.modeName, 0, r + 14);

        ctx.restore();
        continue;
      }

      switch (ob.type) {
        case 'gap': {
          ctx.fillStyle = ob.color;
          const topH = ob.gapY - ob.gapSize / 2 - tunnelTop();
          if (topH > 0) ctx.fillRect(ob.x, tunnelTop(), ob.width, topH);
          const botY = ob.gapY + ob.gapSize / 2;
          const botH = tunnelBottom() - botY;
          if (botH > 0) ctx.fillRect(ob.x, botY, ob.width, botH);
          break;
        }
        case 'spikes_top':
          drawSpikesTop(ob.x, ob.width, ob.spikeHeight, ob.color);
          break;
        case 'spikes_bottom':
          drawSpikesBottom(ob.x, ob.width, ob.spikeHeight, ob.color);
          break;
        case 'spikes_both':
          drawSpikesTop(ob.x, ob.width, ob.topHeight, ob.color);
          drawSpikesBottom(ob.x, ob.width, ob.bottomHeight, ob.color);
          break;
        case 'pillars': {
          for (const pil of ob.pillars) {
            const px = ob.x + pil.offsetX;
            ctx.fillStyle = ob.color;
            ctx.fillRect(px, pil.y, pil.width, pil.height);
          }
          break;
        }
      }
    }
  }

  // --- Player ---
  function drawPlayer() {
    if (!player.alive) return;
    if (skinGlowStyle === 'rainbow') loadSkin();

    // Trail: a thin fading line that follows the player's path
    if (player.trail.length > 1) {
      ctx.lineCap = 'round';
      for (let i = 1; i < player.trail.length; i++) {
        const pct = i / player.trail.length;
        const alpha = pct * 0.35;
        const width = pct * player.size * 0.5;
        ctx.strokeStyle = hexToRgba(skinTrail, alpha);
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(player.trail[i - 1].x, player.trail[i - 1].y);
        ctx.lineTo(player.trail[i].x, player.trail[i].y);
        ctx.stroke();
      }
    }

    // Player shape: varies by mode
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.lineJoin = 'round';

    const s = player.size;
    const skinId = getEquippedSkinId();
    const cornyImage = cornyImages[skinId];
    const isCorny = cornyImage && cornyImage._loaded;
    // Thin outline in the skin's outline colour (matches primary for most skins)
    const outline = skinGlow;

    if (isCorny) {
      const imgH = s * 2;
      const imgW = imgH * 3.4;
      ctx.drawImage(cornyImage, -imgW / 2, -imgH / 2, imgW, imgH);
    } else {
      switch (gameMode) {
        case MODE.WAVE:
        default: {
          // Chevron arrow
          ctx.fillStyle = skinPrimary;
          ctx.beginPath();
          ctx.moveTo(s * 1.3, 0);
          ctx.lineTo(-s, -s);
          ctx.lineTo(-s * 0.3, 0);
          ctx.lineTo(-s, s);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = outline;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.fillStyle = skinSecondary;
          const r = 0.45;
          ctx.beginPath();
          ctx.moveTo(s * 1.3 * r, 0);
          ctx.lineTo(-s * r, -s * r);
          ctx.lineTo(-s * 0.3 * r, 0);
          ctx.lineTo(-s * r, s * r);
          ctx.closePath();
          ctx.fill();
          break;
        }
        case MODE.SHIP: {
          // Triangle rocket
          ctx.fillStyle = skinPrimary;
          ctx.beginPath();
          ctx.moveTo(s * 1.2, 0);
          ctx.lineTo(-s * 0.8, -s * 0.9);
          ctx.lineTo(-s * 0.4, 0);
          ctx.lineTo(-s * 0.8, s * 0.9);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = outline;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          // Flame when thrusting
          if (holding) {
            ctx.fillStyle = ORANGE;
            ctx.beginPath();
            ctx.moveTo(-s * 0.4, -s * 0.3);
            ctx.lineTo(-s * 1.2 - Math.random() * s * 0.3, 0);
            ctx.lineTo(-s * 0.4, s * 0.3);
            ctx.closePath();
            ctx.fill();
          }
          // Inner detail
          ctx.fillStyle = skinSecondary;
          ctx.beginPath();
          ctx.arc(0, 0, s * 0.25, 0, Math.PI * 2);
          ctx.fill();
          break;
        }
        case MODE.BALL: {
          // Circle with direction indicator
          ctx.fillStyle = skinPrimary;
          ctx.beginPath();
          ctx.arc(0, 0, s * 0.85, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = outline;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          // Gravity arrow
          ctx.fillStyle = skinSecondary;
          const dir = gravityDir;
          ctx.beginPath();
          ctx.moveTo(0, dir * s * 0.4);
          ctx.lineTo(-s * 0.3, -dir * s * 0.15);
          ctx.lineTo(s * 0.3, -dir * s * 0.15);
          ctx.closePath();
          ctx.fill();
          break;
        }
        case MODE.UFO: {
          // UFO shape: dome + disc
          ctx.fillStyle = skinPrimary;
          // Disc
          ctx.beginPath();
          ctx.ellipse(0, s * 0.1, s * 1.1, s * 0.35, 0, 0, Math.PI * 2);
          ctx.fill();
          // Dome
          ctx.fillStyle = skinSecondary;
          ctx.beginPath();
          ctx.arc(0, -s * 0.1, s * 0.5, Math.PI, 0);
          ctx.fill();
          ctx.strokeStyle = outline;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(0, s * 0.1, s * 1.1, s * 0.35, 0, 0, Math.PI * 2);
          ctx.stroke();
          break;
        }
        case MODE.SWING: {
          // Pendulum bob with line
          ctx.strokeStyle = MUTED;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, -s * 1.2);
          ctx.lineTo(0, 0);
          ctx.stroke();
          ctx.fillStyle = skinPrimary;
          ctx.beginPath();
          ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = outline;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          // Center dot
          ctx.fillStyle = skinSecondary;
          ctx.beginPath();
          ctx.arc(0, 0, s * 0.25, 0, Math.PI * 2);
          ctx.fill();
          break;
        }
        case MODE.SPIDER: {
          // Spider: circle body with legs
          ctx.fillStyle = skinPrimary;
          ctx.beginPath();
          ctx.arc(0, 0, s * 0.65, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = outline;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          // Legs (4 on each side)
          ctx.strokeStyle = skinPrimary;
          ctx.lineWidth = 1.5;
          ctx.lineCap = 'round';
          for (let i = -1; i <= 1; i += 2) {
            for (let j = 0; j < 4; j++) {
              const angle = (j * 0.35 + 0.3) * i;
              ctx.beginPath();
              ctx.moveTo(Math.cos(angle) * s * 0.5, Math.sin(angle) * s * 0.5);
              ctx.lineTo(Math.cos(angle) * s * 1.2, Math.sin(angle) * s * 1.2 + i * s * 0.3);
              ctx.stroke();
            }
          }
          // Eyes
          ctx.fillStyle = skinSecondary;
          ctx.beginPath();
          ctx.arc(-s * 0.2, -s * 0.15, s * 0.12, 0, Math.PI * 2);
          ctx.arc(s * 0.2, -s * 0.15, s * 0.12, 0, Math.PI * 2);
          ctx.fill();
          break;
        }
        case MODE.ROBOT: {
          // Robot: square body with antenna
          ctx.fillStyle = skinPrimary;
          ctx.beginPath();
          ctx.roundRect(-s * 0.7, -s * 0.7, s * 1.4, s * 1.4, 3);
          ctx.fill();
          ctx.strokeStyle = outline;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          // Antenna
          ctx.strokeStyle = skinPrimary;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, -s * 0.7);
          ctx.lineTo(0, -s * 1.15);
          ctx.stroke();
          ctx.fillStyle = skinPrimary;
          ctx.beginPath();
          ctx.arc(0, -s * 1.2, s * 0.12, 0, Math.PI * 2);
          ctx.fill();
          // Eyes
          ctx.fillStyle = skinSecondary;
          ctx.fillRect(-s * 0.4, -s * 0.35, s * 0.25, s * 0.25);
          ctx.fillRect(s * 0.15, -s * 0.35, s * 0.25, s * 0.25);
          // Mouth
          ctx.fillRect(-s * 0.3, s * 0.15, s * 0.6, s * 0.12);
          break;
        }
        case MODE.CUBE: {
          // Cube: filled square with inner detail
          ctx.fillStyle = skinPrimary;
          ctx.beginPath();
          ctx.roundRect(-s * 0.8, -s * 0.8, s * 1.6, s * 1.6, 3);
          ctx.fill();
          ctx.strokeStyle = outline;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          // Inner square
          ctx.fillStyle = skinSecondary;
          ctx.fillRect(-s * 0.35, -s * 0.35, s * 0.7, s * 0.7);
          break;
        }
      }
    }

    ctx.restore();
  }

  function drawDeathParticles() {
    for (const p of deathParticles) {
      ctx.fillStyle = hexToRgba(p.color, p.life);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // --- Mode Select ---
  // Helper to draw mode icon shapes
  function drawModeIcon(cx, cy, mode, size, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;

    switch (mode) {
      case MODE.WAVE: {
        // Zigzag wave line
        ctx.beginPath();
        ctx.moveTo(-size, size * 0.4);
        ctx.lineTo(-size * 0.4, -size * 0.5);
        ctx.lineTo(size * 0.2, size * 0.4);
        ctx.lineTo(size, -size * 0.5);
        ctx.stroke();
        break;
      }
      case MODE.SHIP: {
        // Rocket/triangle pointing right
        ctx.beginPath();
        ctx.moveTo(size, 0);
        ctx.lineTo(-size * 0.7, -size * 0.7);
        ctx.lineTo(-size * 0.3, 0);
        ctx.lineTo(-size * 0.7, size * 0.7);
        ctx.closePath();
        ctx.fill();
        break;
      }
      case MODE.BALL: {
        // Circle
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.6, 0, Math.PI * 2);
        ctx.fill();
        // Arrow inside showing gravity flip
        ctx.fillStyle = SURFACE;
        ctx.beginPath();
        ctx.moveTo(0, -size * 0.25);
        ctx.lineTo(-size * 0.2, size * 0.1);
        ctx.lineTo(size * 0.2, size * 0.1);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0, size * 0.25);
        ctx.lineTo(-size * 0.2, -size * 0.1);
        ctx.lineTo(size * 0.2, -size * 0.1);
        ctx.closePath();
        ctx.fill();
        break;
      }
      case MODE.UFO: {
        // UFO dome + body
        ctx.beginPath();
        ctx.ellipse(0, size * 0.1, size * 0.8, size * 0.25, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, -size * 0.05, size * 0.4, Math.PI, 0);
        ctx.fill();
        break;
      }
      case MODE.SWING: {
        // Pendulum arc
        ctx.beginPath();
        ctx.arc(0, -size * 0.8, size * 1.2, Math.PI * 0.3, Math.PI * 0.7);
        ctx.stroke();
        // Bob at bottom
        ctx.beginPath();
        ctx.arc(0, size * 0.3, size * 0.3, 0, Math.PI * 2);
        ctx.fill();
        break;
      }
      case MODE.SPIDER: {
        // Spider body + legs
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 1.5;
        for (let side = -1; side <= 1; side += 2) {
          for (let j = 0; j < 3; j++) {
            const a = (j * 0.4 + 0.3) * side;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * size * 0.35, Math.sin(a) * size * 0.35);
            ctx.lineTo(Math.cos(a) * size * 0.85, Math.sin(a) * size * 0.85 + side * size * 0.2);
            ctx.stroke();
          }
        }
        break;
      }
      case MODE.ROBOT: {
        // Robot square + antenna
        ctx.fillRect(-size * 0.45, -size * 0.4, size * 0.9, size * 0.8);
        ctx.beginPath();
        ctx.moveTo(0, -size * 0.4);
        ctx.lineTo(0, -size * 0.7);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, -size * 0.75, size * 0.08, 0, Math.PI * 2);
        ctx.fill();
        break;
      }
      case MODE.CUBE: {
        // Simple square
        ctx.fillRect(-size * 0.5, -size * 0.5, size, size);
        break;
      }
      case MODE.MIXED: {
        // Swirl/portal icon
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.5, 0, Math.PI * 1.5);
        ctx.stroke();
        // Arrow at end of arc
        const ax = Math.cos(Math.PI * 1.5) * size * 0.5;
        const ay = Math.sin(Math.PI * 1.5) * size * 0.5;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax + size * 0.2, ay + size * 0.15);
        ctx.lineTo(ax + size * 0.15, ay - size * 0.2);
        ctx.closePath();
        ctx.fill();
        break;
      }
    }
    ctx.restore();
  }

  function getModeCardLayout() {
    const items = MODE_LIST;
    const row1Count = 5;
    const row2Count = items.length - row1Count;
    const cardW = 80;
    const cardH = 70;
    const gap = 8;
    const rowGap = 10;
    const totalH = cardH * 2 + rowGap;
    const centerY = H() / 2 + 10;
    const row1W = row1Count * cardW + (row1Count - 1) * gap;
    const row2W = row2Count * cardW + (row2Count - 1) * gap;
    const row1X = W() / 2 - row1W / 2;
    const row2X = W() / 2 - row2W / 2;
    const row1Y = centerY - totalH / 2;
    const row2Y = row1Y + cardH + rowGap;

    const cards = [];
    for (let i = 0; i < items.length; i++) {
      if (i < row1Count) {
        cards.push({ x: row1X + i * (cardW + gap), y: row1Y, w: cardW, h: cardH });
      } else {
        const j = i - row1Count;
        cards.push({ x: row2X + j * (cardW + gap), y: row2Y, w: cardW, h: cardH });
      }
    }
    return cards;
  }

  function drawModeSelect() {
    menuPulse += 0.03;
    loadSkin();
    ctx.textAlign = 'center';

    const items = MODE_LIST;
    const cards = getModeCardLayout();

    // Title
    ctx.fillStyle = INK;
    ctx.font = `700 24px ${FONT}`;
    ctx.fillText('Välj läge', W() / 2, cards[0].y - 20);

    for (let i = 0; i < items.length; i++) {

      const cardColor = item.color;

      // Icon
      const iconColor = selected ? cardColor : MUTED;
      drawModeIcon(c.x + c.w / 2, c.y + c.h * 0.32, item.id, 13, iconColor);

      // Label
      ctx.fillStyle = selected ? INK : MUTED;
      ctx.font = `600 11px ${FONT}`;

        ctx.font = `400 9px ${FONT}`;

    ctx.fillStyle = MUTED;

  // ========== UPDATE ==========
  function update() {
    if (state === STATE.PLAYING) {
      const tTop = tunnelTop();
      const tBot = tunnelBottom();
      const GRAVITY = 0.35;

      // === Mode-specific movement ===
      switch (gameMode) {
        case MODE.WAVE: {
          // Instant diagonal: hold = up, release = down
          const moveSpeed = gameSpeed;
          player.vy = holding ? -moveSpeed : moveSpeed;
          player.y += player.vy;
          break;
        }
        case MODE.SHIP: {
          // Hold = thrust up (acceleration), release = fall (gravity)
          if (holding) {
            player.vy -= GRAVITY * 1.3;
          } else {
            player.vy += GRAVITY;
          }
          player.vy = Math.max(-gameSpeed * 2.5, Math.min(gameSpeed * 2.5, player.vy));
          player.y += player.vy;
          break;
        }
        case MODE.BALL: {
          // Tap = flip gravity, but ONLY when touching floor or ceiling
          const onFloor = player.y + player.size >= tBot - 1;
          const onCeil = player.y - player.size <= tTop + 1;
          const grounded = onFloor || onCeil;
          if (tapped && grounded) {
            gravityDir *= -1;
            player.vy = 0;
            tapped = false;
          } else {
            tapped = false; // consume tap even if not grounded
          }
          player.vy += GRAVITY * 1.5 * gravityDir;
          player.vy = Math.max(-gameSpeed * 3, Math.min(gameSpeed * 3, player.vy));
          player.y += player.vy;
          // Stick to surfaces
          if (player.y - player.size < tTop) {
            player.y = tTop + player.size;
            player.vy = 0;
          }
          if (player.y + player.size > tBot) {
            player.y = tBot - player.size;
            player.vy = 0;
          }
          break;
        }
        case MODE.UFO: {
          // Tap = fixed upward boost. Gravity always pulls down.
          if (tapped) {
            player.vy = -gameSpeed * 1.8;
            tapped = false;
          }
          player.vy += GRAVITY * 0.9;
          player.vy = Math.max(-gameSpeed * 2.5, Math.min(gameSpeed * 2.5, player.vy));
          player.y += player.vy;
          break;
        }
        case MODE.SWING: {
          // Tap = flip gravity direction. Continuous flight with momentum.
          if (tapped) {
            gravityDir *= -1;
            tapped = false;
          }
          player.vy += GRAVITY * 0.7 * gravityDir;
          player.vy *= 0.97; // damping for smooth arcs
          player.vy = Math.max(-gameSpeed * 2.2, Math.min(gameSpeed * 2.2, player.vy));
          player.y += player.vy;
          break;
        }
        case MODE.SPIDER: {
          // Tap = teleport to opposite surface (floor↔ceiling)
          const onFloor = player.y + player.size >= tBot - 1;
          const onCeil = player.y - player.size <= tTop + 1;
          const grounded = onFloor || onCeil;
          if (tapped && grounded) {
            if (onFloor) {
              player.y = tTop + player.size;
              gravityDir = -1;
            } else {
              player.y = tBot - player.size;
              gravityDir = 1;
            }
            player.vy = 0;
            tapped = false;
          } else {
            tapped = false;
          }
          player.vy += GRAVITY * 1.4 * gravityDir;
          player.vy = Math.max(-gameSpeed * 3, Math.min(gameSpeed * 3, player.vy));
          player.y += player.vy;
          // Stick to surfaces
          if (player.y - player.size < tTop) {
            player.y = tTop + player.size;
            player.vy = 0;
          }
          if (player.y + player.size > tBot) {
            player.y = tBot - player.size;
            player.vy = 0;
          }
          break;
        }
        case MODE.ROBOT: {
          // Small tap = small hop, hold = keep boosting for big jump
          const onFloor = player.y + player.size >= tBot - 1;
          if (onFloor) {
            player.vy = 0;
            if (tapped || (holding && player.chargeTime === 0)) {
              // Small initial hop
              player.vy = -gameSpeed * 1.2;
              player.chargeTime = 1;
              tapped = false;
            }
          } else {
            // While airborne and holding, keep adding upward thrust
            if (holding && player.chargeTime > 0 && player.chargeTime < 30) {
              player.vy -= GRAVITY * 1.4;
              player.chargeTime++;
            }
            player.vy += GRAVITY * 1.1;
          }
          if (!holding && player.chargeTime > 0) player.chargeTime = 0;
          player.vy = Math.max(-gameSpeed * 3.5, Math.min(gameSpeed * 3.5, player.vy));
          player.y += player.vy;
          tapped = false;
          break;
        }
        case MODE.CUBE: {
          // Classic: tap to jump when on floor
          const onFloor = player.y + player.size >= tBot - 1;
          if (tapped && onFloor) {
            player.vy = -gameSpeed * 3.5;
            tapped = false;
          } else {
            tapped = false;
          }
          player.vy += GRAVITY * 1.4;
          player.vy = Math.max(-gameSpeed * 3, Math.min(gameSpeed * 3, player.vy));
          player.y += player.vy;
          break;
        }
      }

      // Clamp to tunnel walls (ball/spider already handled above)
      if (gameMode !== MODE.BALL && gameMode !== MODE.SPIDER) {
        if (player.y - player.size < tTop) {
          player.y = tTop + player.size;
          if (gameMode !== MODE.WAVE) player.vy = 0;
        }
        if (player.y + player.size > tBot) {
          player.y = tBot - player.size;
          if (gameMode !== MODE.WAVE) player.vy = 0;
        }
      }

      // Trail
      player.trail.push({ x: player.x, y: player.y });
      if (player.trail.length > 22) player.trail.shift();

      // Move obstacles
      for (const ob of obstacles) ob.x -= gameSpeed;

      // Scoring (portals don't count)
      const prevLen = obstacles.filter(ob => ob.type !== 'portal').length;
      obstacles = obstacles.filter(ob => (ob.x + (ob.width || 100)) > -50);
      const newLen = obstacles.filter(ob => ob.type !== 'portal').length;
      score += prevLen - newLen;

      distance += gameSpeed;
      const normalSpeed = baseSpeed + distance * 0.00025;
      if (isMixedMode && mixedTargetSpeed > 0 && gameSpeed < mixedTargetSpeed) {
        // Ramp up ~0.5x per second (60fps) after portal switch
        gameSpeed = Math.min(mixedTargetSpeed, gameSpeed + 0.5 / 60);
        if (gameSpeed >= mixedTargetSpeed) mixedTargetSpeed = 0;
      } else {
        gameSpeed = normalSpeed;
      }

      // Generate new obstacles
      const lastOb = obstacles[obstacles.length - 1];
      if (!lastOb || lastOb.x < W()) {
        const sp = getModeSpacing();
        const spacing = sp.base + Math.random() * sp.rand - Math.min(distance * sp.shrink, sp.maxShrink);
        const newX = lastOb ? lastOb.x + (lastOb.width || 30) + Math.max(spacing, sp.floor) : W() + 100;
        obstacles.push(generateEndlessObstacle(newX));
        mixedObstacleCount++;

        // In mixed mode, insert a portal every 6-10 obstacles
        if (isMixedMode && mixedObstacleCount >= 6 + Math.floor(Math.random() * 5)) {
          mixedObstacleCount = 0;
          // Pick a different mode
          const available = MIXED_SUB_MODES.filter(m => m !== gameMode);
          const nextMode = available[Math.floor(Math.random() * available.length)];
          const info = MODE_LIST.find(m => m.id === nextMode);
          const portalX = newX + spacing + 120;
          obstacles.push({
            type: 'portal',
            x: portalX,
            width: 20,
            targetMode: nextMode,
            color: info ? info.color : INK,
            label: info ? info.icon : '?',
            modeName: info ? info.label : nextMode
          });
        }
      }

      // Portal collision (mixed mode)
      if (isMixedMode) {
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const ob = obstacles[i];
          if (ob.type !== 'portal') continue;
          if (player.x + player.size > ob.x && player.x - player.size < ob.x + ob.width) {
            switchMixedMode(ob.targetMode);
            obstacles.splice(i, 1);
            break;
          }
        }
      }

      if (portalFlashTimer > 0) portalFlashTimer--;

      // Collision
      if (checkCollision()) die();
    }

    if (shakeTimer > 0) shakeTimer--;
    if (flashTimer > 0) flashTimer--;

    for (const p of deathParticles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= p.decay;
    }
    deathParticles = deathParticles.filter(p => p.life > 0);
  }

  // ========== GAME LOOP ==========
  function gameLoop() {
    update();
    ctx.save();

    if (shakeTimer > 0) {
      ctx.translate((Math.random() - 0.5) * shakeTimer * 1.5, (Math.random() - 0.5) * shakeTimer * 1.5);
    }

    drawBackground();

    if (state === STATE.PLAYING) {
      drawObstacles();
      drawPlayer();
      drawUI();
    } else if (state === STATE.DEAD) {
      drawObstacles();
      drawDeathParticles();
      drawUI();
      drawDeathScreen();
    } else if (state === STATE.MODE_SELECT) {
      drawModeSelect();
    } else {
      drawMenu();
    }

    if (flashTimer > 0) {
      ctx.fillStyle = `rgba(28,25,23,${flashTimer / 8 * 0.12})`;
      ctx.fillRect(0, 0, W(), H());
    }

    ctx.restore();
    requestAnimationFrame(gameLoop);
  }

  // --- Start ---
  loadSkin();
  gameLoop();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Draw</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      overflow: hidden;
      font-family: 'Segoe UI', 'Nunito', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; position: absolute; top: 0; left: 0; }
    #guess-input {
      position: absolute; display: none;
      left: 50%; transform: translateX(-50%);
      background: #111128; border: 2px solid #a855f7; color: #fff;
      font-size: 22px; padding: 12px 20px; border-radius: 12px;
      text-align: center; width: 280px; outline: none;
      font-family: 'Segoe UI', sans-serif;
      box-shadow: 0 0 20px rgba(168,85,247,0.3);
    }
    #guess-input:focus { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.4); }
    #guess-btn {
      position: absolute; display: none;
      left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #39ff14, #00d4ff);
      color: #0a0a1a; font-size: 18px; font-weight: bold;
      padding: 12px 40px; border: none; border-radius: 12px;
      cursor: pointer; font-family: 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<input type="text" id="guess-input" placeholder="Skriv vad du ser..." autocomplete="off">
<button id="guess-btn">GISSA!</button>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const guessInput = document.getElementById('guess-input');
  const guessBtn = document.getElementById('guess-btn');

  if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
      if(typeof r==='number')r=[r,r,r,r];const[tl,tr,br,bl]=r;
      this.moveTo(x+tl,y);this.lineTo(x+w-tr,y);this.quadraticCurveTo(x+w,y,x+w,y+tr);
      this.lineTo(x+w,y+h-br);this.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
      this.lineTo(x+bl,y+h);this.quadraticCurveTo(x,y+h,x,y+h-bl);
      this.lineTo(x,y+tl);this.quadraticCurveTo(x,y,x+tl,y);this.closePath();
    };
  }

  let dpr=1,W,H;
  function resize(){dpr=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(drawCanvas){drawCanvas.width=W*dpr;drawCanvas.height=H*dpr;drawCtx.setTransform(dpr,0,0,dpr,0,0);}}
  resize();window.addEventListener('resize',resize);

  const CYAN='#00d4ff',PINK='#ff2d95',PURPLE='#a855f7',GREEN='#39ff14',ORANGE='#ff6a00',YELLOW='#ffe600',BG='#0a0a1a';
  const NEON_COLORS=[CYAN,PINK,PURPLE,GREEN,ORANGE,YELLOW];

  const WORDS=['hund','katt','hus','sol','bil','träd','fisk','blomma','fjäril','pizza',
    'båt','cykel','moln','stjärna','hjärta','skog','berg','flod','bro','slott',
    'raket','robot','drake','krona','gitarr','piano','tårta','glass','äpple','banan',
    'elefant','giraff','pingvin','delfin','kanin','uggla','orm','groda','snigel','spindel',
    'flygplan','tåg','buss','paraply','regnbåge','måne','vulkan','lampa','stol','bord',
    'bok','penna','nyckel','klocka','telefon','ballong','fotboll','snögubbe','clown',
    'dinosaurie','enhörning','hammare','svärd','sköld','spöke','pumpa','jordgubbe',
    'hamburger','diamant','fjäder','ananas','ko','gris','häst','tiger','lejon'];

  // State: menu, word-reveal, drawing, guessing, result, gameover
  const ROUNDS=5, DRAW_TIME=45;
  let state='menu', round=0, score=0, currentWord='', timeLeft=0, timerInterval=null;
  let usedWords=[], guessResult='', guessCorrect=false, resultTimer=0;

  // Drawing
  let drawColor=CYAN, brushSize=8, isEraser=false, isDrawing=false, lastX=0, lastY=0;
  const BRUSH_SIZES=[4,8,14];
  let brushIdx=1;
  let drawCanvas, drawCtx;

  function initDrawCanvas(){
    drawCanvas=document.createElement('canvas');
    drawCanvas.width=canvas.width;drawCanvas.height=canvas.height;
    drawCtx=drawCanvas.getContext('2d');drawCtx.setTransform(dpr,0,0,dpr,0,0);
    drawCtx.fillStyle='#111128';drawCtx.fillRect(0,0,W,H);
  }

  function pickWord(){
    if(usedWords.length>=WORDS.length)usedWords=[];
    let w;do{w=WORDS[Math.floor(Math.random()*WORDS.length)];}while(usedWords.includes(w));
    usedWords.push(w);return w;
  }

  function startGame(){state='word-reveal';round=0;score=0;usedWords=[];nextRound();}

  function nextRound(){
    round++;currentWord=pickWord();initDrawCanvas();
    drawColor=CYAN;brushSize=BRUSH_SIZES[1];brushIdx=1;isEraser=false;
    state='word-reveal';resultTimer=0;
    hideGuessUI();
  }

  function startDrawing(){
    state='drawing';timeLeft=DRAW_TIME;
    clearInterval(timerInterval);
    timerInterval=setInterval(()=>{timeLeft--;if(timeLeft<=0){timeLeft=0;clearInterval(timerInterval);finishDrawing();}},1000);
  }

  function finishDrawing(){
    clearInterval(timerInterval);state='guessing';
    showGuessUI();
  }

  function showGuessUI(){
    guessInput.style.display='block';
    guessInput.style.top=(H*0.72)+'px';
    guessInput.value='';
    guessBtn.style.display='block';
    guessBtn.style.top=(H*0.82)+'px';
    setTimeout(()=>guessInput.focus(),100);
  }

  function hideGuessUI(){
    guessInput.style.display='none';guessBtn.style.display='none';
  }

  function submitGuess(){
    const guess=guessInput.value.trim().toLowerCase();
    if(!guess)return;
    hideGuessUI();
    guessCorrect=guess===currentWord.toLowerCase();
    if(guessCorrect)score++;
    guessResult=guess;state='result';resultTimer=150;
  }

  guessBtn.addEventListener('click',submitGuess);
  guessInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')submitGuess();});

  // Drawing area
  const TOOLBAR_H=95, BOTTOM_H=60;
  function canvasTop(){return TOOLBAR_H;}
  function canvasBot(){return H-BOTTOM_H;}

  function drawLine(x1,y1,x2,y2){
    if(y1<canvasTop()||y2<canvasTop()||y1>canvasBot()||y2>canvasBot())return;
    drawCtx.lineCap='round';drawCtx.lineJoin='round';
    if(isEraser){
      drawCtx.globalCompositeOperation='source-over';drawCtx.strokeStyle='#111128';
      drawCtx.lineWidth=brushSize*3;drawCtx.shadowBlur=0;
      drawCtx.beginPath();drawCtx.moveTo(x1,y1);drawCtx.lineTo(x2,y2);drawCtx.stroke();
    }else{
      drawCtx.globalCompositeOperation='lighter';
      drawCtx.shadowColor=drawColor;drawCtx.shadowBlur=brushSize*2;
      drawCtx.strokeStyle=drawColor+'66';drawCtx.lineWidth=brushSize*2;
      drawCtx.beginPath();drawCtx.moveTo(x1,y1);drawCtx.lineTo(x2,y2);drawCtx.stroke();
      drawCtx.shadowBlur=brushSize;drawCtx.strokeStyle=drawColor;drawCtx.lineWidth=brushSize;
      drawCtx.beginPath();drawCtx.moveTo(x1,y1);drawCtx.lineTo(x2,y2);drawCtx.stroke();
      drawCtx.shadowBlur=0;drawCtx.strokeStyle='#ffffff88';drawCtx.lineWidth=brushSize*0.4;
      drawCtx.beginPath();drawCtx.moveTo(x1,y1);drawCtx.lineTo(x2,y2);drawCtx.stroke();
      drawCtx.globalCompositeOperation='source-over';
    }
    drawCtx.shadowBlur=0;
  }

  function clearDrawing(){drawCtx.globalCompositeOperation='source-over';drawCtx.fillStyle='#111128';drawCtx.fillRect(0,0,W,H);}

  // Input
  function getPos(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}

  function onDown(e){
    if(state==='menu'){const p=getPos(e);const bx=W/2-110,by=H*0.65;if(p.x>=bx&&p.x<=bx+220&&p.y>=by&&p.y<=by+55)startGame();return;}
    if(state==='word-reveal'){startDrawing();return;}
    if(state==='gameover'){const p=getPos(e);const bx=W/2-110,by=H*0.72;if(p.x>=bx&&p.x<=bx+220&&p.y>=by&&p.y<=by+55)startGame();return;}
    if(state!=='drawing')return;
    e.preventDefault();
    const p=getPos(e);
    // Toolbar
    if(p.y<canvasTop()){handleToolbar(p);return;}
    // Bottom bar
    if(p.y>canvasBot()){handleBottom(p);return;}
    isDrawing=true;lastX=p.x;lastY=p.y;drawLine(lastX,lastY,lastX+0.1,lastY+0.1);
  }
  function onMove(e){if(!isDrawing||state!=='drawing')return;e.preventDefault();const p=getPos(e);drawLine(lastX,lastY,p.x,p.y);lastX=p.x;lastY=p.y;}
  function onUp(){isDrawing=false;}

  canvas.addEventListener('mousedown',onDown);canvas.addEventListener('mousemove',onMove);
  canvas.addEventListener('mouseup',onUp);canvas.addEventListener('mouseleave',onUp);
  canvas.addEventListener('touchstart',(e)=>{e.preventDefault();onDown(e);},{passive:false});
  canvas.addEventListener('touchmove',(e)=>{e.preventDefault();onMove(e);},{passive:false});
  canvas.addEventListener('touchend',onUp);

  function handleToolbar(p){
    const y=65;
    // Colors
    for(let i=0;i<NEON_COLORS.length;i++){
      const cx=15+i*36;
      if(p.x>=cx&&p.x<=cx+28&&p.y>=y&&p.y<=y+28){drawColor=NEON_COLORS[i];isEraser=false;return;}
    }
    // Brush sizes
    const bx=W-200;
    for(let i=0;i<3;i++){
      const x=bx+i*38;
      if(p.x>=x&&p.x<=x+32&&p.y>=y&&p.y<=y+28){brushIdx=i;brushSize=BRUSH_SIZES[i];isEraser=false;return;}
    }
    // Eraser
    if(p.x>=W-80&&p.x<=W-20&&p.y>=y&&p.y<=y+28){isEraser=!isEraser;return;}
  }

  function handleBottom(p){
    const by=canvasBot()+10;
    if(p.x>=15&&p.x<=95&&p.y>=by&&p.y<=by+40)clearDrawing();
    if(p.x>=W-140&&p.x<=W-15&&p.y>=by&&p.y<=by+40)finishDrawing();
  }

  // Render helpers
  function glow(text,x,y,color,size,align){
    ctx.save();ctx.textAlign=align||'center';ctx.textBaseline='middle';
    ctx.font=`bold ${size}px 'Segoe UI',sans-serif`;
    ctx.shadowColor=color;ctx.shadowBlur=15;ctx.fillStyle=color;ctx.fillText(text,x,y);
    ctx.shadowBlur=0;ctx.restore();
  }
  function neonBtn(x,y,w,h,color,text,sz){
    ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,12);
    ctx.fillStyle=color+'22';ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=2;
    ctx.shadowColor=color;ctx.shadowBlur=10;ctx.stroke();ctx.shadowBlur=0;ctx.restore();
    glow(text,x+w/2,y+h/2,color,sz||20);
  }

  function render(){
    ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);

    if(state==='menu'){
      glow('NEON DRAW',W/2,H*0.22,CYAN,Math.min(52,W*0.11));
      glow('En ritar, en gissar!',W/2,H*0.33,PURPLE,18);
      ctx.save();ctx.textAlign='center';ctx.font='15px Segoe UI';ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.fillText('Spelare 1 ritar ett ord',W/2,H*0.42);
      ctx.fillText('Spelare 2 gissar vad det är',W/2,H*0.47);ctx.restore();
      neonBtn(W/2-110,H*0.65,220,55,GREEN,'SPELA',26);
    }

    else if(state==='word-reveal'){
      glow(`Runda ${round}/${ROUNDS}`,W/2,H*0.2,PURPLE,20);
      glow('Ditt ord att rita:',W/2,H*0.35,CYAN,20);
      glow(currentWord.toUpperCase(),W/2,H*0.48,PINK,Math.min(56,W*0.12));
      ctx.save();ctx.textAlign='center';ctx.font='16px Segoe UI';ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.fillText('Visa INTE ordet för den som gissar!',W/2,H*0.60);
      ctx.fillText('Tryck var som helst för att börja rita',W/2,H*0.66);ctx.restore();
    }

    else if(state==='drawing'){
      // Top bar
      ctx.fillStyle='#0d0d24';ctx.fillRect(0,0,W,55);
      glow(`Runda ${round}/${ROUNDS}`,70,28,PURPLE,16);
      glow(`${score} poäng`,W/2,28,CYAN,16);
      const tc=timeLeft<=10?ORANGE:CYAN;
      glow(`${timeLeft}s`,W-40,28,tc,18);

      // Toolbar
      ctx.fillStyle='#0d0d24cc';ctx.fillRect(0,55,W,38);
      const ty=65;
      for(let i=0;i<NEON_COLORS.length;i++){
        const cx=15+i*36;const c=NEON_COLORS[i];const sel=!isEraser&&drawColor===c;
        ctx.save();ctx.beginPath();ctx.roundRect(cx,ty,28,28,6);ctx.fillStyle=c;
        ctx.shadowColor=c;ctx.shadowBlur=sel?15:4;ctx.fill();
        if(sel){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}ctx.restore();
      }
      const labels=['S','M','L'];const bsx=W-200;
      for(let i=0;i<3;i++){
        const x=bsx+i*38;const sel=!isEraser&&brushIdx===i;
        ctx.save();ctx.beginPath();ctx.roundRect(x,ty,32,28,6);
        ctx.fillStyle=sel?CYAN+'44':'#222244';ctx.fill();
        ctx.strokeStyle=sel?CYAN:'#444466';ctx.lineWidth=sel?2:1;ctx.stroke();ctx.restore();
        ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.font='bold 13px Segoe UI';ctx.fillStyle=sel?CYAN:'#8888aa';
        ctx.fillText(labels[i],x+16,ty+14);ctx.restore();
      }
      const ex=W-80;
      ctx.save();ctx.beginPath();ctx.roundRect(ex,ty,60,28,6);
      ctx.fillStyle=isEraser?ORANGE+'44':'#222244';ctx.fill();
      ctx.strokeStyle=isEraser?ORANGE:'#444466';ctx.lineWidth=isEraser?2:1;ctx.stroke();ctx.restore();
      ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 12px Segoe UI';
      ctx.fillStyle=isEraser?ORANGE:'#8888aa';ctx.fillText('SUDD',ex+30,ty+14);ctx.restore();

      // Drawing area
      ctx.save();ctx.beginPath();ctx.rect(0,canvasTop(),W,canvasBot()-canvasTop());ctx.clip();
      ctx.drawImage(drawCanvas,0,0,drawCanvas.width,drawCanvas.height,0,0,W,H);ctx.restore();
      ctx.strokeStyle=PURPLE+'33';ctx.lineWidth=1;ctx.strokeRect(0,canvasTop(),W,canvasBot()-canvasTop());

      // Bottom bar
      ctx.fillStyle='#0d0d24cc';ctx.fillRect(0,canvasBot(),W,BOTTOM_H);
      const by=canvasBot()+10;
      neonBtn(15,by,80,38,ORANGE,'RENSA',14);
      neonBtn(W-140,by,125,38,GREEN,'KLAR!',16);
      ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='15px Segoe UI';
      ctx.fillStyle=PURPLE;ctx.fillText(`Poäng: ${score}`,W/2,by+19);ctx.restore();
    }

    else if(state==='guessing'){
      ctx.fillStyle='#0d0d24';ctx.fillRect(0,0,W,50);
      glow(`Runda ${round}/${ROUNDS}`,W/2,26,PURPLE,18);

      // Show drawing
      const top=60,bot=H*0.65;
      ctx.save();ctx.beginPath();ctx.rect(0,top,W,bot-top);ctx.clip();
      ctx.drawImage(drawCanvas,0,0,drawCanvas.width,drawCanvas.height,0,0,W,H);ctx.restore();
      ctx.strokeStyle=CYAN+'33';ctx.lineWidth=1;ctx.strokeRect(0,top,W,bot-top);

      glow('Vad föreställer ritningen?',W/2,H*0.68,CYAN,20);
      // Input and button are HTML elements positioned via CSS
    }

    else if(state==='result'){
      // Show drawing small
      const dw=Math.min(W-40,350),dh=Math.min(H*0.35,250);
      const dx=W/2-dw/2,dy=30;
      ctx.save();ctx.beginPath();ctx.roundRect(dx,dy,dw,dh,12);ctx.clip();
      ctx.drawImage(drawCanvas,0,0,drawCanvas.width,drawCanvas.height,dx,dy,dw,dh);ctx.restore();
      ctx.save();ctx.beginPath();ctx.roundRect(dx,dy,dw,dh,12);ctx.strokeStyle=CYAN;ctx.lineWidth=2;ctx.stroke();ctx.restore();

      const cy=dy+dh+30;
      if(guessCorrect){
        glow('RÄTT!',W/2,cy,GREEN,36);
        glow(`"${guessResult}" var korrekt!`,W/2,cy+40,CYAN,18);
      }else{
        glow('FEL!',W/2,cy,PINK,36);
        glow(`Gissning: "${guessResult}"`,W/2,cy+35,ORANGE,16);
        glow(`Rätt svar: ${currentWord.toUpperCase()}`,W/2,cy+65,GREEN,20);
      }

      resultTimer--;
      if(resultTimer<=0){
        if(round>=ROUNDS){state='gameover';}
        else nextRound();
      }

      // Progress bar
      const pb=resultTimer/150;
      ctx.fillStyle='#222244';ctx.fillRect(W*0.2,H-30,W*0.6,6);
      ctx.fillStyle=CYAN;ctx.fillRect(W*0.2,H-30,W*0.6*pb,6);
    }

    else if(state==='gameover'){
      glow('SPELET SLUT!',W/2,H*0.2,CYAN,40);
      glow(`${score} / ${ROUNDS}`,W/2,H*0.35,PINK,48);
      glow('rätt gissningar',W/2,H*0.42,PURPLE,16);
      let msg='';
      if(score===ROUNDS)msg='Perfekt! Ni är ett dreamteam!';
      else if(score>=4)msg='Fantastiskt samarbete!';
      else if(score>=3)msg='Bra jobbat!';
      else if(score>=1)msg='Fortsätt öva!';
      else msg='Nästa gång blir bättre!';
      glow(msg,W/2,H*0.55,GREEN,20);
      neonBtn(W/2-110,H*0.72,220,55,GREEN,'SPELA IGEN',22);
    }

    requestAnimationFrame(render);
  }

  render();
})();
</script>
</body>
</html>

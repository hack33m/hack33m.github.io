<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rita</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f4;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; position: absolute; top: 0; left: 0; }
    #guess-input {
      position: absolute; display: none;
      left: 50%; transform: translateX(-50%);
      background: #ffffff; border: 1px solid #d6d3d1; color: #1c1917;
      font-size: 22px; padding: 12px 20px; border-radius: 10px;
      text-align: center; width: 280px; outline: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    #guess-input::placeholder { color: #78716c; }
    #guess-input:focus { border-color: #2563eb; }
    #guess-btn {
      position: absolute; display: none;
      left: 50%; transform: translateX(-50%);
      background: #2563eb;
      color: #ffffff; font-size: 18px; font-weight: 600;
      padding: 12px 40px; border: none; border-radius: 10px;
      cursor: pointer; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<input type="text" id="guess-input" placeholder="Skriv vad du ser..." autocomplete="off">
<button id="guess-btn">Gissa!</button>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const guessInput = document.getElementById('guess-input');
  const guessBtn = document.getElementById('guess-btn');

  if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
      if(typeof r==='number')r=[r,r,r,r];const[tl,tr,br,bl]=r;
      this.moveTo(x+tl,y);this.lineTo(x+w-tr,y);this.quadraticCurveTo(x+w,y,x+w,y+tr);
      this.lineTo(x+w,y+h-br);this.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
      this.lineTo(x+bl,y+h);this.quadraticCurveTo(x,y+h,x,y+h-bl);
      this.lineTo(x,y+tl);this.quadraticCurveTo(x,y,x+tl,y);this.closePath();
    };
  }

  let drawCanvas=null, drawCtx=null;
  let dpr=1,W=300,H=500;
  function resize(){
    dpr=window.devicePixelRatio||1;
    W=window.innerWidth||300;H=window.innerHeight||500;
    canvas.width=W*dpr;canvas.height=H*dpr;
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(typeof drawCanvas!=='undefined'&&drawCanvas){drawCanvas.width=W*dpr;drawCanvas.height=H*dpr;drawCtx.setTransform(dpr,0,0,dpr,0,0);}
  }
  resize();
  window.addEventListener('resize',resize);
  window.addEventListener('load',resize);

  // Flat palette
  const BG='#f5f5f4',SURFACE='#ffffff',SURFACE2='#e7e5e4',LINE='#d6d3d1',INK='#1c1917',MUTED='#78716c';
  const ACCENT='#2563eb',RED='#dc2626',GREEN='#16a34a',YELLOW='#ca8a04',PURPLE='#7c3aed';
  const FONT="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  // Brush colours (first one is the default)
  const BRUSH_COLORS=[INK,ACCENT,RED,GREEN,YELLOW,PURPLE];

  const WORDS=['hund','katt','hus','sol','bil','träd','fisk','blomma','fjäril','pizza',
    'båt','cykel','moln','stjärna','hjärta','skog','berg','flod','bro','slott',
    'raket','robot','drake','krona','gitarr','piano','tårta','glass','äpple','banan',
    'elefant','giraff','pingvin','delfin','kanin','uggla','orm','groda','snigel','spindel',
    'flygplan','tåg','buss','paraply','regnbåge','måne','vulkan','lampa','stol','bord',
    'bok','penna','nyckel','klocka','telefon','ballong','fotboll','snögubbe','clown',
    'dinosaurie','enhörning','hammare','svärd','sköld','spöke','pumpa','jordgubbe',
    'hamburger','diamant','fjäder','ananas','ko','gris','häst','tiger','lejon'];

  // State: menu, word-reveal, drawing, guessing, result, gameover
  const ROUNDS=5, DRAW_TIME=45;
  let state='menu', round=0, score=0, currentWord='', timeLeft=0, timerInterval=null;
  let usedWords=[], guessResult='', guessCorrect=false, resultTimer=0;

  // Drawing
  let drawColor=BRUSH_COLORS[0], brushSize=8, isEraser=false, isDrawing=false, lastX=0, lastY=0;
  const BRUSH_SIZES=[4,8,14];
  let brushIdx=1;
  // drawCanvas declared above resize()

  function initDrawCanvas(){
    drawCanvas=document.createElement('canvas');
    drawCanvas.width=canvas.width;drawCanvas.height=canvas.height;
    drawCtx=drawCanvas.getContext('2d');drawCtx.setTransform(dpr,0,0,dpr,0,0);
    drawCtx.fillStyle=SURFACE;drawCtx.fillRect(0,0,W,H);
  }

  function pickWord(){
    if(usedWords.length>=WORDS.length)usedWords=[];
    let w;do{w=WORDS[Math.floor(Math.random()*WORDS.length)];}while(usedWords.includes(w));
    usedWords.push(w);return w;
  }

  function startGame(){state='word-reveal';round=0;score=0;usedWords=[];nextRound();}

  function nextRound(){
    round++;currentWord=pickWord();initDrawCanvas();
    drawColor=BRUSH_COLORS[0];brushSize=BRUSH_SIZES[1];brushIdx=1;isEraser=false;
    state='word-reveal';resultTimer=0;
    hideGuessUI();
  }

  function startDrawing(){
    state='drawing';timeLeft=DRAW_TIME;
    clearInterval(timerInterval);
    timerInterval=setInterval(()=>{timeLeft--;if(timeLeft<=0){timeLeft=0;clearInterval(timerInterval);finishDrawing();}},1000);
  }

  function finishDrawing(){
    clearInterval(timerInterval);state='guessing';
    showGuessUI();
  }

  function showGuessUI(){
    guessInput.style.display='block';
    guessInput.style.top=(H*0.72)+'px';
    guessInput.value='';
    guessBtn.style.display='block';
    guessBtn.style.top=(H*0.82)+'px';
    setTimeout(()=>guessInput.focus(),100);
  }

  function hideGuessUI(){
    guessInput.style.display='none';guessBtn.style.display='none';
  }

  function submitGuess(){
    const guess=guessInput.value.trim().toLowerCase();
    if(!guess)return;
    hideGuessUI();
    guessCorrect=guess===currentWord.toLowerCase();
    if(guessCorrect)score++;
    guessResult=guess;state='result';resultTimer=150;
  }

  guessBtn.addEventListener('click',submitGuess);
  guessInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')submitGuess();});

  // Drawing area
  const TOOLBAR_H=95, BOTTOM_H=60;
  function canvasTop(){return TOOLBAR_H;}
  function canvasBot(){return H-BOTTOM_H;}

  function drawLine(x1,y1,x2,y2){
    if(y1<canvasTop()||y2<canvasTop()||y1>canvasBot()||y2>canvasBot())return;
    drawCtx.lineCap='round';drawCtx.lineJoin='round';
    if(isEraser){
      drawCtx.globalCompositeOperation='source-over';drawCtx.strokeStyle=SURFACE;
      drawCtx.lineWidth=brushSize*3;
      drawCtx.beginPath();drawCtx.moveTo(x1,y1);drawCtx.lineTo(x2,y2);drawCtx.stroke();
    }else{
      // Flat, solid stroke
      drawCtx.globalCompositeOperation='source-over';
      drawCtx.strokeStyle=drawColor;drawCtx.lineWidth=brushSize;
      drawCtx.beginPath();drawCtx.moveTo(x1,y1);drawCtx.lineTo(x2,y2);drawCtx.stroke();
    }
  }

  function clearDrawing(){drawCtx.globalCompositeOperation='source-over';drawCtx.fillStyle=SURFACE;drawCtx.fillRect(0,0,W,H);}

  // Input
  function getPos(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}

  function onDown(e){
    if(state==='menu'){const p=getPos(e);const bx=W/2-110,by=H*0.65;if(p.x>=bx&&p.x<=bx+220&&p.y>=by&&p.y<=by+55)startGame();return;}
    if(state==='word-reveal'){startDrawing();return;}
    if(state==='gameover'){const p=getPos(e);const bx=W/2-110,by=H*0.72;if(p.x>=bx&&p.x<=bx+220&&p.y>=by&&p.y<=by+55)startGame();return;}
    if(state!=='drawing')return;
    e.preventDefault();
    const p=getPos(e);
    // Toolbar
    if(p.y<canvasTop()){handleToolbar(p);return;}
    // Bottom bar
    if(p.y>canvasBot()){handleBottom(p);return;}
    isDrawing=true;lastX=p.x;lastY=p.y;drawLine(lastX,lastY,lastX+0.1,lastY+0.1);
  }
  function onMove(e){if(!isDrawing||state!=='drawing')return;e.preventDefault();const p=getPos(e);drawLine(lastX,lastY,p.x,p.y);lastX=p.x;lastY=p.y;}
  function onUp(){isDrawing=false;}

  canvas.addEventListener('mousedown',onDown);canvas.addEventListener('mousemove',onMove);
  canvas.addEventListener('mouseup',onUp);canvas.addEventListener('mouseleave',onUp);
  canvas.addEventListener('touchstart',(e)=>{e.preventDefault();onDown(e);},{passive:false});
  canvas.addEventListener('touchmove',(e)=>{e.preventDefault();onMove(e);},{passive:false});
  canvas.addEventListener('touchend',onUp);

  function handleToolbar(p){
    const y=65;
    // Colors
    for(let i=0;i<BRUSH_COLORS.length;i++){
      const cx=15+i*36;
      if(p.x>=cx&&p.x<=cx+28&&p.y>=y&&p.y<=y+28){drawColor=BRUSH_COLORS[i];isEraser=false;return;}
    }
    // Brush sizes
    const bx=W-200;
    for(let i=0;i<3;i++){
      const x=bx+i*38;
      if(p.x>=x&&p.x<=x+32&&p.y>=y&&p.y<=y+28){brushIdx=i;brushSize=BRUSH_SIZES[i];isEraser=false;return;}
    }
    // Eraser
    if(p.x>=W-80&&p.x<=W-20&&p.y>=y&&p.y<=y+28){isEraser=!isEraser;return;}
  }

  function handleBottom(p){
    const by=canvasBot()+10;
    if(p.x>=15&&p.x<=95&&p.y>=by&&p.y<=by+40)clearDrawing();
    if(p.x>=W-140&&p.x<=W-15&&p.y>=by&&p.y<=by+40)finishDrawing();
  }

  // Render helpers
  // Flat text
  function label(text,x,y,color,size,align,weight){
    ctx.save();ctx.textAlign=align||'center';ctx.textBaseline='middle';
    ctx.font=`${weight||600} ${size}px ${FONT}`;
    ctx.fillStyle=color;ctx.fillText(text,x,y);
    ctx.restore();
  }
  // Flat button: primary = accent fill + white text, secondary = white fill + line border + ink text
  function flatBtn(x,y,w,h,primary,text,sz){
    ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,10);
    if(primary){ctx.fillStyle=ACCENT;ctx.fill();}
    else{ctx.fillStyle=SURFACE;ctx.fill();ctx.strokeStyle=LINE;ctx.lineWidth=1;ctx.stroke();}
    ctx.restore();
    label(text,x+w/2,y+h/2,primary?'#ffffff':INK,sz||20);
  }

  function render(){
    ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);

    if(state==='menu'){
      label('Rita',W/2,H*0.22,INK,Math.min(52,W*0.11),'center',700);
      label('En ritar, en gissar!',W/2,H*0.33,MUTED,18);
      ctx.save();ctx.textAlign='center';ctx.font=`400 15px ${FONT}`;ctx.fillStyle=MUTED;
      ctx.fillText('Spelare 1 ritar ett ord',W/2,H*0.42);
      ctx.fillText('Spelare 2 gissar vad det är',W/2,H*0.47);ctx.restore();
      flatBtn(W/2-110,H*0.65,220,55,true,'Spela',22);
    }

    else if(state==='word-reveal'){
      label(`Runda ${round}/${ROUNDS}`,W/2,H*0.2,MUTED,20);
      label('Ditt ord att rita:',W/2,H*0.35,INK,20);
      label(currentWord.toUpperCase(),W/2,H*0.48,ACCENT,Math.min(56,W*0.12),'center',700);
      ctx.save();ctx.textAlign='center';ctx.font=`400 16px ${FONT}`;ctx.fillStyle=MUTED;
      ctx.fillText('Visa INTE ordet för den som gissar!',W/2,H*0.60);
      ctx.fillText('Tryck var som helst för att börja rita',W/2,H*0.66);ctx.restore();
    }

    else if(state==='drawing'){
      // Top bar
      ctx.fillStyle=SURFACE;ctx.fillRect(0,0,W,55);
      label(`Runda ${round}/${ROUNDS}`,70,28,MUTED,16);
      label(`${score} poäng`,W/2,28,ACCENT,16);
      const tc=timeLeft<=10?RED:INK;
      label(`${timeLeft}s`,W-40,28,tc,18);

      // Toolbar
      ctx.fillStyle=SURFACE;ctx.fillRect(0,55,W,38);
      ctx.fillStyle=LINE;ctx.fillRect(0,92,W,1);
      const ty=65;
      for(let i=0;i<BRUSH_COLORS.length;i++){
        const cx=15+i*36;const c=BRUSH_COLORS[i];const sel=!isEraser&&drawColor===c;
        ctx.save();ctx.beginPath();ctx.roundRect(cx,ty,28,28,6);ctx.fillStyle=c;ctx.fill();ctx.restore();
        if(sel){ctx.save();ctx.beginPath();ctx.roundRect(cx-3,ty-3,34,34,8);ctx.strokeStyle=ACCENT;ctx.lineWidth=2;ctx.stroke();ctx.restore();}
      }
      const labels=['S','M','L'];const bsx=W-200;
      for(let i=0;i<3;i++){
        const x=bsx+i*38;const sel=!isEraser&&brushIdx===i;
        ctx.save();ctx.beginPath();ctx.roundRect(x,ty,32,28,6);
        ctx.fillStyle=sel?ACCENT:SURFACE;ctx.fill();
        if(!sel){ctx.strokeStyle=LINE;ctx.lineWidth=1;ctx.stroke();}ctx.restore();
        ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.font=`600 13px ${FONT}`;ctx.fillStyle=sel?'#ffffff':MUTED;
        ctx.fillText(labels[i],x+16,ty+14);ctx.restore();
      }
      const ex=W-80;
      ctx.save();ctx.beginPath();ctx.roundRect(ex,ty,60,28,6);
      ctx.fillStyle=isEraser?ACCENT:SURFACE;ctx.fill();
      if(!isEraser){ctx.strokeStyle=LINE;ctx.lineWidth=1;ctx.stroke();}ctx.restore();
      ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`600 12px ${FONT}`;
      ctx.fillStyle=isEraser?'#ffffff':MUTED;ctx.fillText('Sudd',ex+30,ty+14);ctx.restore();

      // Drawing area
      ctx.save();ctx.beginPath();ctx.rect(0,canvasTop(),W,canvasBot()-canvasTop());ctx.clip();
      ctx.drawImage(drawCanvas,0,0,drawCanvas.width,drawCanvas.height,0,0,W,H);ctx.restore();
      ctx.strokeStyle=LINE;ctx.lineWidth=1;ctx.strokeRect(0,canvasTop(),W,canvasBot()-canvasTop());

      // Bottom bar
      ctx.fillStyle=BG;ctx.fillRect(0,canvasBot(),W,BOTTOM_H);
      const by=canvasBot()+10;
      flatBtn(15,by,80,38,false,'Rensa',14);
      flatBtn(W-140,by,125,38,true,'Klar!',16);
      ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`400 15px ${FONT}`;
      ctx.fillStyle=MUTED;ctx.fillText(`Poäng: ${score}`,W/2,by+19);ctx.restore();
    }

    else if(state==='guessing'){
      ctx.fillStyle=SURFACE;ctx.fillRect(0,0,W,50);
      ctx.fillStyle=LINE;ctx.fillRect(0,49,W,1);
      label(`Runda ${round}/${ROUNDS}`,W/2,26,MUTED,18);

      // Show drawing
      const top=60,bot=H*0.65;
      ctx.save();ctx.beginPath();ctx.rect(0,top,W,bot-top);ctx.clip();
      ctx.drawImage(drawCanvas,0,0,drawCanvas.width,drawCanvas.height,0,0,W,H);ctx.restore();
      ctx.strokeStyle=LINE;ctx.lineWidth=1;ctx.strokeRect(0,top,W,bot-top);

      label('Vad föreställer ritningen?',W/2,H*0.68,INK,20);
      // Input and button are HTML elements positioned via CSS
    }

    else if(state==='result'){
      // Show drawing small
      const dw=Math.min(W-40,350),dh=Math.min(H*0.35,250);
      const dx=W/2-dw/2,dy=30;
      ctx.save();ctx.beginPath();ctx.roundRect(dx,dy,dw,dh,10);ctx.clip();
      ctx.drawImage(drawCanvas,0,0,drawCanvas.width,drawCanvas.height,dx,dy,dw,dh);ctx.restore();
      ctx.save();ctx.beginPath();ctx.roundRect(dx,dy,dw,dh,10);ctx.strokeStyle=LINE;ctx.lineWidth=1;ctx.stroke();ctx.restore();

      const cy=dy+dh+30;
      if(guessCorrect){
        label('Rätt!',W/2,cy,GREEN,36,'center',700);
        label(`"${guessResult}" var korrekt!`,W/2,cy+40,INK,18);
      }else{
        label('Fel!',W/2,cy,RED,36,'center',700);
        label(`Gissning: "${guessResult}"`,W/2,cy+35,MUTED,16);
        label(`Rätt svar: ${currentWord.toUpperCase()}`,W/2,cy+65,INK,20);
      }

      resultTimer--;
      if(resultTimer<=0){
        if(round>=ROUNDS){state='gameover';}
        else nextRound();
      }

      // Progress bar
      const pb=resultTimer/150;
      ctx.fillStyle=SURFACE2;ctx.fillRect(W*0.2,H-30,W*0.6,6);
      ctx.fillStyle=ACCENT;ctx.fillRect(W*0.2,H-30,W*0.6*pb,6);
    }

    else if(state==='gameover'){
      label('Spelet slut!',W/2,H*0.2,INK,40,'center',700);
      label(`${score} / ${ROUNDS}`,W/2,H*0.35,ACCENT,48,'center',700);
      label('rätt gissningar',W/2,H*0.42,MUTED,16,'center',400);
      let msg='';
      if(score===ROUNDS)msg='Perfekt! Ni är ett dreamteam!';
      else if(score>=4)msg='Fantastiskt samarbete!';
      else if(score>=3)msg='Bra jobbat!';
      else if(score>=1)msg='Fortsätt öva!';
      else msg='Nästa gång blir bättre!';
      label(msg,W/2,H*0.55,INK,20);
      flatBtn(W/2-110,H*0.72,220,55,true,'Spela igen',22);
    }

    requestAnimationFrame(render);
  }

  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corny Pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a9fcc;
      overflow: hidden;
      font-family: 'Segoe UI', 'Nunito', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  </style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<script src="../../js/sounds.js"></script>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.focus();
  window.addEventListener('load', () => canvas.focus());

  // roundRect polyfill
  if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (typeof r === 'number') r = [r,r,r,r];
      const [tl,tr,br,bl] = r;
      this.moveTo(x+tl, y);
      this.lineTo(x+w-tr, y);
      this.quadraticCurveTo(x+w, y, x+w, y+tr);
      this.lineTo(x+w, y+h-br);
      this.quadraticCurveTo(x+w, y+h, x+w-br, y+h);
      this.lineTo(x+bl, y+h);
      this.quadraticCurveTo(x, y+h, x, y+h-bl);
      this.lineTo(x, y+tl);
      this.quadraticCurveTo(x, y, x+tl, y);
      this.closePath();
    };
  }

  // Hi-DPI
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const W = () => window.innerWidth;
  const H = () => window.innerHeight;

  // Colors
  const COL = {
    caramel: '#d4860a',
    chocolate: '#5c3317',
    cream: '#fff8e7',
    caramelLight: '#f5b342',
    bgTop: '#1a9fcc',
    bgBot: '#1e3a5f',
  };

  // Game state
  const WIN_SCORE = 7;
  let state = 'menu'; // menu, playing, gameover
  let playerScore = 0;
  let aiScore = 0;
  let winner = '';
  let highScore = parseInt(localStorage.getItem('corny-pong-hi')) || 0;

  // Paddles
  const PADDLE_W = 18;
  const PADDLE_H_RATIO = 0.18; // fraction of screen height
  const PADDLE_MARGIN = 30;

  let player = { y: 0 };
  let ai = { y: 0 };

  function paddleH() { return H() * PADDLE_H_RATIO; }

  // Ball
  const BALL_R = 16;
  let ball = { x: 0, y: 0, vx: 0, vy: 0, speed: 0 };
  const BASE_SPEED_RATIO = 0.006; // relative to screen width
  const SPEED_INCREMENT = 0.4;

  // Particles
  let particles = [];

  // Input
  let keys = {};
  let touchY = null;

  window.addEventListener('keydown', e => { keys[e.key] = true; });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    touchY = e.touches[0].clientY;
    if (state === 'menu') startGame();
    else if (state === 'gameover') startGame();
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    touchY = e.touches[0].clientY;
  }, { passive: false });
  canvas.addEventListener('touchend', () => { touchY = null; });

  canvas.addEventListener('click', () => {
    if (state === 'menu') startGame();
    else if (state === 'gameover') startGame();
  });

  window.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      if (state === 'menu') startGame();
      else if (state === 'gameover') startGame();
    }
  });

  // Init / Reset
  function resetBall(direction) {
    ball.x = W() / 2;
    ball.y = H() / 2;
    const baseSpeed = W() * BASE_SPEED_RATIO;
    ball.speed = baseSpeed;
    const angle = (Math.random() * 0.8 - 0.4); // -0.4 to 0.4 rad
    ball.vx = Math.cos(angle) * baseSpeed * direction;
    ball.vy = Math.sin(angle) * baseSpeed;
  }

  function startGame() {
    NeonSounds.init();
    state = 'playing';
    playerScore = 0;
    aiScore = 0;
    player.y = H() / 2 - paddleH() / 2;
    ai.y = H() / 2 - paddleH() / 2;
    particles = [];
    resetBall(1);
  }

  // AI
  function updateAI(dt) {
    const difficulty = 0.3 + Math.min((playerScore + aiScore) * 0.07, 0.55);
    const aiSpeed = ball.speed * difficulty * 1.1;
    const pH = paddleH();
    const aiCenter = ai.y + pH / 2;
    const target = ball.y;
    const diff = target - aiCenter;
    const move = Math.sign(diff) * Math.min(Math.abs(diff), aiSpeed * dt * 60);
    ai.y += move;
    ai.y = Math.max(0, Math.min(H() - pH, ai.y));
  }

  // Particles
  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 0.5 + Math.random() * 0.4,
        maxLife: 0.5 + Math.random() * 0.4,
        r: 2 + Math.random() * 3,
        color,
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Draw Corny ball
  function drawBall(x, y, r) {
    // Caramel top half
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, Math.PI, 0);
    ctx.closePath();
    ctx.fillStyle = COL.caramel;
    ctx.fill();

    // Chocolate bottom half
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI);
    ctx.closePath();
    ctx.fillStyle = COL.chocolate;
    ctx.fill();

    // Eyes
    const eyeR = r * 0.16;
    const eyeOffX = r * 0.3;
    const eyeOffY = r * 0.15;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x - eyeOffX, y - eyeOffY, eyeR * 1.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + eyeOffX, y - eyeOffY, eyeR * 1.4, 0, Math.PI * 2);
    ctx.fill();
    // Pupils
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(x - eyeOffX + ball.vx * 0.3, y - eyeOffY, eyeR * 0.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + eyeOffX + ball.vx * 0.3, y - eyeOffY, eyeR * 0.8, 0, Math.PI * 2);
    ctx.fill();

    // Smile
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y + r * 0.05, r * 0.3, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();

    // Outline
    ctx.strokeStyle = COL.chocolate;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }

  // Draw Corny paddle
  function drawPaddle(x, y, w, h) {
    ctx.save();
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, COL.caramelLight);
    grad.addColorStop(0.45, COL.caramel);
    grad.addColorStop(0.55, COL.chocolate);
    grad.addColorStop(1, '#3a1f0d');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 9);
    ctx.fill();
    // Outline
    ctx.strokeStyle = COL.chocolate;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 9);
    ctx.stroke();
    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.roundRect(x + 3, y + 4, w * 0.35, h - 8, 4);
    ctx.fill();
    ctx.restore();
  }

  // Draw background
  function drawBg() {
    const grad = ctx.createLinearGradient(0, 0, 0, H());
    grad.addColorStop(0, COL.bgTop);
    grad.addColorStop(1, COL.bgBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W(), H());

    // Center dashed line
    ctx.setLineDash([10, 10]);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W() / 2, 0);
    ctx.lineTo(W() / 2, H());
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Draw score
  function drawScore() {
    const fontSize = Math.max(32, W() * 0.06);
    ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillText(playerScore, W() / 2 - fontSize * 1.2, 20);
    ctx.fillText(aiScore, W() / 2 + fontSize * 1.2, 20);
  }

  // Draw highscore
  function drawHi() {
    ctx.font = `bold 14px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillText(`Bästa: ${highScore} vinster`, W() / 2, H() - 28);
  }

  // Menu
  function drawMenu() {
    drawBg();
    drawHi();

    const cx = W() / 2;
    const cy = H() / 2;

    // Title
    const titleSize = Math.max(40, W() * 0.08);
    ctx.font = `bold ${titleSize}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Shadow
    ctx.fillStyle = COL.chocolate;
    ctx.fillText('CORNY PONG', cx + 3, cy - titleSize * 0.9 + 3);
    ctx.fillStyle = COL.caramelLight;
    ctx.fillText('CORNY PONG', cx, cy - titleSize * 0.9);

    // Corny ball decorative
    drawBall(cx, cy + 10, BALL_R * 2);

    // Play button
    const btnW = Math.max(180, W() * 0.25);
    const btnH = 54;
    const btnX = cx - btnW / 2;
    const btnY = cy + 70;
    ctx.fillStyle = COL.caramel;
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 14);
    ctx.fill();
    ctx.strokeStyle = COL.chocolate;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 14);
    ctx.stroke();

    ctx.font = `bold 24px 'Segoe UI', sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('SPELA', cx, btnY + btnH / 2);

    // Instructions
    ctx.font = `15px 'Segoe UI', sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('Piltangenter / W,S / Touch', cx, btnY + btnH + 30);
    ctx.fillText('Först till 7 vinner!', cx, btnY + btnH + 52);
  }

  // Game over
  function drawGameOver() {
    drawBg();
    drawScore();
    drawHi();

    const cx = W() / 2;
    const cy = H() / 2;

    // Overlay
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W(), H());

    const titleSize = Math.max(30, W() * 0.055);
    ctx.font = `bold ${titleSize}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const msg = winner === 'player' ? 'DU VANN!' : 'AI VANN!';
    ctx.fillStyle = COL.chocolate;
    ctx.fillText(msg, cx + 2, cy - titleSize * 0.7 + 2);
    ctx.fillStyle = winner === 'player' ? COL.caramelLight : '#ff6666';
    ctx.fillText(msg, cx, cy - titleSize * 0.7);

    // Final score
    ctx.font = `bold 22px 'Segoe UI', sans-serif`;
    ctx.fillStyle = COL.cream;
    ctx.fillText(`${playerScore} - ${aiScore}`, cx, cy + 5);

    // Retry button
    const btnW = Math.max(180, W() * 0.25);
    const btnH = 54;
    const btnX = cx - btnW / 2;
    const btnY = cy + 50;
    ctx.fillStyle = COL.caramel;
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 14);
    ctx.fill();
    ctx.strokeStyle = COL.chocolate;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 14);
    ctx.stroke();

    ctx.font = `bold 24px 'Segoe UI', sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.fillText('SPELA IGEN', cx, btnY + btnH / 2);
  }

  // Update game
  let lastTime = 0;
  function update(dt) {
    if (state !== 'playing') return;

    const pH = paddleH();

    // Player input
    const moveSpeed = H() * 0.012;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) {
      player.y -= moveSpeed;
    }
    if (keys['ArrowDown'] || keys['s'] || keys['S']) {
      player.y += moveSpeed;
    }
    if (touchY !== null) {
      const target = touchY - pH / 2;
      const diff = target - player.y;
      player.y += diff * 0.25;
    }
    player.y = Math.max(0, Math.min(H() - pH, player.y));

    // AI
    updateAI(dt);

    // Ball movement
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Top/bottom bounce
    if (ball.y - BALL_R <= 0) {
      ball.y = BALL_R;
      ball.vy = Math.abs(ball.vy);
      spawnParticles(ball.x, ball.y, COL.caramelLight, 6);
    }
    if (ball.y + BALL_R >= H()) {
      ball.y = H() - BALL_R;
      ball.vy = -Math.abs(ball.vy);
      spawnParticles(ball.x, ball.y, COL.caramelLight, 6);
    }

    // Player paddle collision (left)
    const plX = PADDLE_MARGIN;
    if (
      ball.vx < 0 &&
      ball.x - BALL_R <= plX + PADDLE_W &&
      ball.x - BALL_R >= plX &&
      ball.y >= player.y &&
      ball.y <= player.y + pH
    ) {
      ball.x = plX + PADDLE_W + BALL_R;
      const hitPos = (ball.y - player.y) / pH - 0.5; // -0.5 to 0.5
      const angle = hitPos * Math.PI * 0.65;
      ball.speed += SPEED_INCREMENT;
      ball.vx = Math.cos(angle) * ball.speed;
      ball.vy = Math.sin(angle) * ball.speed;
      NeonSounds.bounce();
      spawnParticles(ball.x, ball.y, COL.caramelLight, 10);
    }

    // AI paddle collision (right)
    const aiX = W() - PADDLE_MARGIN - PADDLE_W;
    if (
      ball.vx > 0 &&
      ball.x + BALL_R >= aiX &&
      ball.x + BALL_R <= aiX + PADDLE_W &&
      ball.y >= ai.y &&
      ball.y <= ai.y + pH
    ) {
      ball.x = aiX - BALL_R;
      const hitPos = (ball.y - ai.y) / pH - 0.5;
      const angle = Math.PI - hitPos * Math.PI * 0.65;
      ball.speed += SPEED_INCREMENT;
      ball.vx = Math.cos(angle) * ball.speed;
      ball.vy = Math.sin(angle) * ball.speed;
      NeonSounds.bounce();
      spawnParticles(ball.x, ball.y, COL.caramelLight, 10);
    }

    // Score
    if (ball.x + BALL_R < 0) {
      aiScore++;
      NeonSounds.collect();
      spawnParticles(0, ball.y, '#ff6666', 15);
      checkWin();
      if (state === 'playing') resetBall(1);
    }
    if (ball.x - BALL_R > W()) {
      playerScore++;
      NeonSounds.collect();
      spawnParticles(W(), ball.y, COL.caramelLight, 15);
      checkWin();
      if (state === 'playing') resetBall(-1);
    }

    updateParticles(dt);
  }

  function checkWin() {
    if (playerScore >= WIN_SCORE) {
      winner = 'player';
      state = 'gameover';
      NeonSounds.death();
      const wins = playerScore;
      if (wins > highScore) {
        highScore = wins;
        localStorage.setItem('corny-pong-hi', highScore);
      }
      window.parent.postMessage({ type: 'game-score', score: playerScore, game: 'corny-pong' }, '*');
    } else if (aiScore >= WIN_SCORE) {
      winner = 'ai';
      state = 'gameover';
      NeonSounds.death();
      window.parent.postMessage({ type: 'game-score', score: playerScore, game: 'corny-pong' }, '*');
    }
  }

  // Draw playing state
  function drawPlaying() {
    drawBg();
    drawScore();
    drawHi();

    const pH = paddleH();

    // Player paddle
    drawPaddle(PADDLE_MARGIN, player.y, PADDLE_W, pH);

    // AI paddle
    drawPaddle(W() - PADDLE_MARGIN - PADDLE_W, ai.y, PADDLE_W, pH);

    // Ball
    drawBall(ball.x, ball.y, BALL_R);

    // Particles
    drawParticles();
  }

  // Main loop
  function frame(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    update(dt);

    ctx.clearRect(0, 0, W(), H());

    if (state === 'menu') drawMenu();
    else if (state === 'playing') drawPlaying();
    else if (state === 'gameover') drawGameOver();

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(time => {
    lastTime = time;
    frame(time);
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ringflyg</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f5f5f4;
      --surface: #ffffff;
      --line: #d6d3d1;
      --ink: #1c1917;
      --muted: #78716c;
      --accent: #2563eb;
      --red: #dc2626;
      --green: #16a34a;
      --yellow: #ca8a04;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #d9e9fb; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; outline: none; }

    .hud {
      position: fixed;
      top: 12px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
    .hud .score { font-size: 28px; font-weight: 700; }
    .hud .combo { font-size: 15px; font-weight: 600; color: var(--green); margin-top: 2px; min-height: 18px; }
    .hud .right { text-align: right; }
    .hud .lives { font-size: 20px; color: var(--red); letter-spacing: 2px; }
    .hud .best { font-size: 14px; color: var(--muted); font-weight: 600; margin-top: 2px; }
    .hud.hidden { display: none; }

    .flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: rgba(220, 38, 38, 0.18);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .flash.on { opacity: 1; transition: none; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(245, 245, 244, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      padding: 26px 24px;
      width: min(360px, 100%);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .panel h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
    .panel h2 { font-size: 24px; font-weight: 700; }
    .panel p { color: var(--muted); font-size: 15px; line-height: 1.5; }
    .panel .big { font-size: 40px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
    .panel .record { color: var(--green); font-weight: 600; }
    .panel .record.hidden { display: none; }
    .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; text-align: left; font-size: 14px; color: var(--muted); }
    .keys b { color: var(--ink); font-weight: 600; white-space: nowrap; }
    .btn {
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 10px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.9; }
    .error { color: var(--red); }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="flash" id="flash"></div>

  <div class="hud hidden" id="hud">
    <div>
      <div class="score" id="score">0</div>
      <div class="combo" id="combo"></div>
    </div>
    <div class="right">
      <div class="lives" id="lives">♥♥♥</div>
      <div class="best" id="best">Rekord 0</div>
    </div>
  </div>

  <div class="overlay" id="menu">
    <div class="panel">
      <h1>Ringflyg</h1>
      <p>Flyg genom de gula ringarna. Flera i rad ger bonus. Akta dig för de röda bollarna, och missar du tre ringar är det slut.</p>
      <div class="keys">
        <b>Mus eller finger</b><span>dra för att styra</span>
        <b>Piltangenter / WASD</b><span>styr planet</span>
      </div>
      <button class="btn" id="start-btn">Flyg</button>
    </div>
  </div>

  <div class="overlay hidden" id="gameover">
    <div class="panel">
      <h2 id="go-title">Krasch!</h2>
      <div class="big" id="go-score">0</div>
      <p id="go-detail"></p>
      <p class="record hidden" id="go-record">Nytt rekord!</p>
      <button class="btn" id="again-btn">Flyg igen</button>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../js/sounds.js"></script>
<script>
(() => {
  const menu = document.getElementById('menu');
  if (typeof THREE === 'undefined') {
    menu.querySelector('.panel').innerHTML =
      '<h1>Ringflyg</h1><p class="error">Kunde inte ladda 3D-grafiken. Kolla internetanslutningen och ladda om sidan.</p>';
    return;
  }

  // ----- Settings -----
  const X_LIMIT = 7;            // how far left/right the plane may fly
  const Y_MIN = 2.5, Y_MAX = 10;
  const START_SPEED = 14;
  const MAX_SPEED = 30;
  const SPEED_GAIN = 0.22;      // per second
  const STEER_SPEED = 10;       // units per second with the keyboard
  const RING_GAP = 26;          // distance between rings
  const RING_R = 1.7;           // inner radius you have to fly through
  const OBST_R = 0.9;
  const LIVES = 3;
  const HI_KEY = 'ringflyg-hi';

  const COLORS = {
    skyTop: 0x5b9bf0, horizon: 0xd9e9fb, ground: 0x8fcf8a, groundAlt: 0x84c77f, tree: 0x3d9a55, trunk: 0x8b5e3c,
    plane: 0xdc2626, wing: 0xffffff, prop: 0x1c1917, ring: 0xeab308, ringHit: 0x16a34a, ringMiss: 0x9ca3af,
    obstacle: 0xdc2626, cloud: 0xffffff,
  };

  // ----- Three.js setup -----
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(COLORS.horizon);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(COLORS.horizon, 40, 140);

  // Sky gradient
  (() => {
    const c = document.createElement('canvas');
    c.width = 2; c.height = 256;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 256);
    const hex = n => '#' + n.toString(16).padStart(6, '0');
    grad.addColorStop(0, hex(COLORS.skyTop));
    grad.addColorStop(0.75, hex(COLORS.horizon));
    grad.addColorStop(1, hex(COLORS.horizon));
    g.fillStyle = grad;
    g.fillRect(0, 0, 2, 256);
    scene.background = new THREE.CanvasTexture(c);
  })();

  const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 200);

  scene.add(new THREE.HemisphereLight(0xdcebff, 0x6b8f5e, 0.65));
  const sun = new THREE.DirectionalLight(0xfff4e0, 0.95);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 20, bottom: -10, near: 1, far: 60 });
  sun.shadow.bias = -0.0008;
  scene.add(sun, sun.target);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 78 : 62;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  const mat = (c, extra) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.8, metalness: 0, flatShading: true }, extra));

  // ----- The plane -----
  const plane = new THREE.Group();
  (() => {
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 2.4), mat(COLORS.plane));
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.7, 4), mat(COLORS.plane));
    nose.rotation.x = -Math.PI / 2; nose.rotation.y = Math.PI / 4; nose.position.z = -1.55;
    const wing = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.1, 0.8), mat(COLORS.wing));
    wing.position.set(0, 0.05, -0.2);
    const tailWing = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.08, 0.45), mat(COLORS.wing));
    tailWing.position.set(0, 0.1, 1.05);
    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.6, 0.5), mat(COLORS.plane));
    fin.position.set(0, 0.45, 1.05);
    const cockpit = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.6), mat(0x93c5fd, { roughness: 0.3 }));
    cockpit.position.set(0, 0.42, -0.35);
    plane.add(body, nose, wing, tailWing, fin, cockpit);
    plane.traverse(m => { if (m.isMesh) m.castShadow = true; });
  })();
  const prop = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.12, 0.05), mat(COLORS.prop));
  prop.position.z = -1.92;
  plane.add(prop);
  scene.add(plane);

  // ----- Ground, trees, clouds -----
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), mat(COLORS.ground));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const GEO = {
    ring: new THREE.TorusGeometry(RING_R + 0.2, 0.2, 10, 40),
    obstacle: new THREE.IcosahedronGeometry(OBST_R, 0),
    trunk: new THREE.CylinderGeometry(0.25, 0.35, 1.2, 6),
    crown: new THREE.ConeGeometry(1.2, 2.6, 7),
    puff: new THREE.IcosahedronGeometry(1, 1),
    shard: new THREE.BoxGeometry(0.25, 0.25, 0.25),
  };
  const MAT = {
    trunk: mat(COLORS.trunk), crown: mat(COLORS.tree),
    obstacle: mat(COLORS.obstacle, { roughness: 0.5 }),
    cloud: mat(COLORS.cloud, { roughness: 1, emissive: 0xffffff, emissiveIntensity: 0.6, fog: false }),
  };

  // Trees stay out of the flight corridor so they never block the way
  const trees = [];
  for (let i = 0; i < 70; i++) {
    const t = new THREE.Group();
    const trunk = new THREE.Mesh(GEO.trunk, MAT.trunk); trunk.position.y = 0.6;
    const crown = new THREE.Mesh(GEO.crown, MAT.crown); crown.position.y = 2.4;
    trunk.castShadow = crown.castShadow = true;
    t.add(trunk, crown);
    scene.add(t);
    trees.push(t);
  }
  function placeTree(t, zFrom) {
    const side = Math.random() < 0.5 ? -1 : 1;
    t.position.set(side * (X_LIMIT + 4 + Math.random() * 40), 0, zFrom - Math.random() * 140);
    t.scale.setScalar(0.8 + Math.random() * 1.2);
  }

  const clouds = [];
  for (let i = 0; i < 14; i++) {
    const c = new THREE.Group();
    const n = 3 + Math.floor(Math.random() * 3);
    for (let k = 0; k < n; k++) {
      const puff = new THREE.Mesh(GEO.puff, MAT.cloud);
      puff.position.set(k * 1.3 - n * 0.6, Math.random() * 0.6, (Math.random() - 0.5) * 1.2);
      puff.scale.setScalar(0.9 + Math.random() * 0.8);
      c.add(puff);
    }
    scene.add(c);
    clouds.push(c);
  }
  function placeCloud(c, zFrom) {
    const side = Math.random() < 0.5 ? -1 : 1;
    c.position.set(side * (X_LIMIT + 8 + Math.random() * 30), 14 + Math.random() * 12, zFrom - Math.random() * 160);
    c.scale.setScalar(1.2 + Math.random() * 1.8);
  }

  // ----- Game state -----
  let rings = [], obstacles = [], shards = [];
  let p, speed, score, combo, bestCombo, ringsHit, lives, running, deadTimer, lastTime, nextRingZ, lastRing;
  let best = parseInt(localStorage.getItem(HI_KEY) || '0', 10) || 0;
  const input = { left: false, right: false, up: false, down: false };
  let pointerTarget = null;   // where a mouse or finger wants the plane to go

  const hud = document.getElementById('hud');
  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');
  const livesEl = document.getElementById('lives');
  const bestEl = document.getElementById('best');
  const flashEl = document.getElementById('flash');
  bestEl.textContent = 'Rekord ' + best;

  const sound = name => { try { if (window.NeonSounds) NeonSounds[name](); } catch (e) {} };

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function spawnRing() {
    // Each ring is a reachable step away from the previous one
    const x = clamp(lastRing.x + (Math.random() * 2 - 1) * 5, -X_LIMIT + 1, X_LIMIT - 1);
    const y = clamp(lastRing.y + (Math.random() * 2 - 1) * 3, Y_MIN + 0.5, Y_MAX - 0.5);
    const z = nextRingZ;
    const m = new THREE.Mesh(GEO.ring, mat(COLORS.ring, { roughness: 0.4, emissive: 0x8a6200, emissiveIntensity: 0.35 }));
    m.position.set(x, y, z);
    m.castShadow = true;
    scene.add(m);
    rings.push({ mesh: m, x, y, z, done: false, fade: 0 });

    // Sometimes an obstacle halfway, placed clear of the straight path between the two rings
    const difficulty = clamp((ringsHit + rings.length) / 40, 0, 1);
    if (rings.length > 2 && Math.random() < 0.35 + 0.45 * difficulty) {
      const mx = (lastRing.x + x) / 2, my = (lastRing.y + y) / 2;
      let ox, oy, tries = 0;
      do {
        ox = clamp(mx + (Math.random() * 2 - 1) * 6, -X_LIMIT, X_LIMIT);
        oy = clamp(my + (Math.random() * 2 - 1) * 4, Y_MIN, Y_MAX);
        tries++;
      } while (Math.hypot(ox - mx, oy - my) < 3 && tries < 20);
      if (Math.hypot(ox - mx, oy - my) >= 3) {
        const o = new THREE.Mesh(GEO.obstacle, MAT.obstacle);
        o.position.set(ox, oy, z + RING_GAP / 2);
        o.castShadow = true;
        scene.add(o);
        obstacles.push({ mesh: o, x: ox, y: oy, z: z + RING_GAP / 2 });
      }
    }
    lastRing = { x, y };
    nextRingZ -= RING_GAP;
  }

  function clearWorld() {
    for (const list of [rings, obstacles, shards]) for (const o of list) scene.remove(o.mesh);
    rings = []; obstacles = []; shards = [];
  }

  function resetGame() {
    clearWorld();
    p = { x: 0, y: 5, z: 0, vx: 0, vy: 0 };
    speed = START_SPEED;
    score = 0; combo = 0; bestCombo = 0; ringsHit = 0; lives = LIVES; deadTimer = 0;
    lastRing = { x: 0, y: 5 };
    nextRingZ = -40;
    pointerTarget = null;
    plane.visible = true;
    for (let i = 0; i < 6; i++) spawnRing();
    for (const t of trees) placeTree(t, 20);
    for (const c of clouds) placeCloud(c, 20);
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    comboEl.textContent = combo >= 2 ? combo + ' i rad!' : '';
    livesEl.textContent = '♥'.repeat(lives) + '♡'.repeat(LIVES - lives);
  }

  function flash() {
    flashEl.classList.add('on');
    requestAnimationFrame(() => requestAnimationFrame(() => flashEl.classList.remove('on')));
  }

  // ----- Input -----
  const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
                   ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
  document.addEventListener('keydown', e => {
    if (!running) {
      if ((e.key === ' ' || e.key === 'Enter') && (!menu.classList.contains('hidden') || !gameoverEl.classList.contains('hidden'))) {
        e.preventDefault(); startGame();
      }
      return;
    }
    if (KEYMAP[e.key]) { e.preventDefault(); input[KEYMAP[e.key]] = true; pointerTarget = null; }
  });
  document.addEventListener('keyup', e => { if (KEYMAP[e.key]) input[KEYMAP[e.key]] = false; });

  // Mouse: the plane follows the cursor. Finger: drag to move the plane from where it is.
  let drag = null;
  function screenToTarget(cx, cy) {
    const nx = cx / window.innerWidth * 2 - 1, ny = cy / window.innerHeight * 2 - 1;
    return { x: clamp(nx * X_LIMIT * 1.15, -X_LIMIT, X_LIMIT), y: clamp((Y_MIN + Y_MAX) / 2 - ny * (Y_MAX - Y_MIN) * 0.65, Y_MIN, Y_MAX) };
  }
  stage.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse') drag = { cx: e.clientX, cy: e.clientY, x: p ? p.x : 0, y: p ? p.y : 5 };
  });
  window.addEventListener('pointermove', e => {
    if (!running || deadTimer) return;
    if (e.pointerType === 'mouse') { pointerTarget = screenToTarget(e.clientX, e.clientY); return; }
    if (!drag) return;
    const k = 18 / Math.min(window.innerWidth, 600);   // finger distance -> world distance
    pointerTarget = {
      x: clamp(drag.x + (e.clientX - drag.cx) * k, -X_LIMIT, X_LIMIT),
      y: clamp(drag.y - (e.clientY - drag.cy) * k, Y_MIN, Y_MAX),
    };
  });
  window.addEventListener('pointerup', () => { drag = null; });

  // ----- Game flow -----
  const gameoverEl = document.getElementById('gameover');
  let soundReady = false;

  function startGame() {
    if (!soundReady && window.NeonSounds) { try { NeonSounds.init(); } catch (e) {} soundReady = true; }
    menu.classList.add('hidden');
    gameoverEl.classList.add('hidden');
    hud.classList.remove('hidden');
    resetGame();
    running = true;
    lastTime = performance.now();
  }

  function burst(x, y, z) {
    const m1 = mat(COLORS.plane), m2 = mat(COLORS.wing);
    for (let i = 0; i < 22; i++) {
      const s = new THREE.Mesh(GEO.shard, i % 2 ? m1 : m2);
      s.position.set(x, y, z);
      s.castShadow = true;
      scene.add(s);
      shards.push({ mesh: s, vx: (Math.random() - 0.5) * 9, vy: Math.random() * 6, vz: (Math.random() - 0.7) * 9, life: 1.4 });
    }
  }

  function die(reason) {
    if (deadTimer) return;
    deadTimer = 1;
    sound('crash');
    if (reason === 'crash') { burst(p.x, p.y, p.z); plane.visible = false; }
    gameoverEl.dataset.reason = reason;
  }

  function showGameOver() {
    running = false;
    updateHud();
    const isRecord = score > best;
    if (isRecord) { best = score; try { localStorage.setItem(HI_KEY, String(best)); } catch (e) {} }
    bestEl.textContent = 'Rekord ' + best;
    document.getElementById('go-title').textContent = gameoverEl.dataset.reason === 'crash' ? 'Krasch!' : 'Slut på liv!';
    document.getElementById('go-score').textContent = score;
    document.getElementById('go-detail').textContent = ringsHit + ' ringar, bästa svit ' + bestCombo + ' i rad';
    document.getElementById('go-record').classList.toggle('hidden', !isRecord);
    gameoverEl.classList.remove('hidden');
    try { window.parent.postMessage({ type: 'game-score', game: 'ringflyg', score }, '*'); } catch (e) {}
  }

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('again-btn').addEventListener('click', startGame);

  // ----- Update -----
  function update(dt) {
    // Shards fly even after the crash
    shards = shards.filter(s => {
      s.life -= dt; s.vy -= 14 * dt;
      s.mesh.position.x += s.vx * dt; s.mesh.position.y = Math.max(0.12, s.mesh.position.y + s.vy * dt); s.mesh.position.z += s.vz * dt;
      s.mesh.rotation.x += dt * 7; s.mesh.rotation.y += dt * 5;
      if (s.life <= 0) { scene.remove(s.mesh); return false; }
      return true;
    });

    if (deadTimer) {
      deadTimer -= dt;
      if (deadTimer <= 0) { deadTimer = 0; showGameOver(); }
      return;
    }

    speed = Math.min(MAX_SPEED, speed + SPEED_GAIN * dt);
    const prevZ = p.z;
    p.z -= speed * dt;

    // Steering: keys give a velocity, a pointer gives a target to glide towards
    let tvx = 0, tvy = 0;
    if (pointerTarget) {
      tvx = clamp((pointerTarget.x - p.x) * 5, -STEER_SPEED * 1.4, STEER_SPEED * 1.4);
      tvy = clamp((pointerTarget.y - p.y) * 5, -STEER_SPEED * 1.4, STEER_SPEED * 1.4);
    } else {
      tvx = (input.right - input.left) * STEER_SPEED;
      tvy = (input.up - input.down) * STEER_SPEED;
    }
    p.vx += (tvx - p.vx) * Math.min(1, dt * 8);
    p.vy += (tvy - p.vy) * Math.min(1, dt * 8);
    p.x = clamp(p.x + p.vx * dt, -X_LIMIT, X_LIMIT);
    p.y = clamp(p.y + p.vy * dt, Y_MIN, Y_MAX);

    // Rings: judged the moment the plane passes their plane
    for (const r of rings) {
      if (r.done) {
        r.fade += dt;
        r.mesh.scale.setScalar(1 + r.fade * 0.8);
        r.mesh.material.opacity = Math.max(0, 1 - r.fade * 2);
        continue;
      }
      if (prevZ >= r.z && p.z < r.z) {
        r.done = true;
        r.mesh.material.transparent = true;
        if (Math.hypot(p.x - r.x, p.y - r.y) < RING_R) {
          combo++; ringsHit++;
          bestCombo = Math.max(bestCombo, combo);
          score += 10 * Math.min(combo, 5);   // up to x5 for a streak
          r.mesh.material.color.setHex(COLORS.ringHit);
          r.mesh.material.emissive.setHex(0x0a5a26);
          sound(combo >= 3 ? 'combo' : 'collect');
        } else {
          combo = 0; lives--;
          r.mesh.material.color.setHex(COLORS.ringMiss);
          r.mesh.material.emissive.setHex(0x000000);
          flash();
          sound('hit');
          if (lives <= 0) { updateHud(); die('lives'); return; }
        }
      } else {
        r.mesh.rotation.z += dt * 0.6;
      }
    }

    // Obstacles
    for (const o of obstacles) {
      o.mesh.rotation.x += dt; o.mesh.rotation.y += dt * 0.7;
      if (Math.abs(p.z - o.z) < 1.4 && Math.hypot(p.x - o.x, p.y - o.y) < OBST_R + 0.75) { die('crash'); return; }
    }

    // Keep rings coming, remove what is behind
    while (nextRingZ > p.z - 150) spawnRing();
    const behind = p.z + 15;
    rings = rings.filter(r => { if (r.z > behind) { scene.remove(r.mesh); r.mesh.material.dispose(); return false; } return true; });
    obstacles = obstacles.filter(o => { if (o.z > behind) { scene.remove(o.mesh); return false; } return true; });
    for (const t of trees) if (t.position.z > p.z + 20) placeTree(t, p.z - 120);
    for (const c of clouds) if (c.position.z > p.z + 30) placeCloud(c, p.z - 130);

    updateHud();
  }

  // ----- Render -----
  function draw(dt) {
    if (p) {
      plane.position.set(p.x, p.y, p.z);
      // Bank into turns and pitch with climbs
      plane.rotation.z = -p.vx * 0.06;
      plane.rotation.x = p.vy * 0.04;
      prop.rotation.z += dt * 40;

      ground.position.set(0, 0, p.z - 80);
      sun.position.set(p.x + 8, 24, p.z + 6);
      sun.target.position.set(p.x, 0, p.z - 8);

      camera.position.set(p.x * 0.6, p.y + 1.8, p.z + 8);
      camera.lookAt(p.x * 0.8, p.y + 0.2, p.z - 12);
    }
    renderer.render(scene, camera);
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - (lastTime || now)) / 1000);
    lastTime = now;
    if (running) update(dt);
    draw(dt);
    requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });

  resetGame();
  running = false;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

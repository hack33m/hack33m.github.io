<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#e8eefc"/>
  <!-- Zig-zag corridor -->
  <polyline points="60,200 140,120 220,180 330,60" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="60,200 140,120 220,180 330,60" fill="none" stroke="#d6d3d1" stroke-width="2" stroke-dasharray="6 8"/>
  <!-- Obstacle -->
  <rect x="261" y="116" width="18" height="18" rx="4" fill="#dc2626"/>
  <!-- Player with trail -->
  <circle cx="78" cy="182" r="4" fill="#bfd0f8"/>
  <circle cx="92" cy="168" r="6" fill="#93b4f5"/>
  <circle cx="110" cy="150" r="13" fill="#2563eb" stroke="#1c1917" stroke-width="2"/>
</svg>

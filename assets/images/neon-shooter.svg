<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Player ship -->
  <polygon points="200,130 190,155 210,155" fill="#00d4ff"/>
  <!-- Bullets -->
  <rect x="198" y="105" width="4" height="10" rx="2" fill="#00d4ff" opacity="0.8"/>
  <rect x="198" y="85" width="4" height="10" rx="2" fill="#00d4ff" opacity="0.5"/>
  <!-- Enemies -->
  <circle cx="120" cy="90" r="12" fill="none" stroke="#ff2d95" stroke-width="2"/>
  <circle cx="300" cy="100" r="10" fill="none" stroke="#ff6a00" stroke-width="2"/>
  <polygon points="320,200 310,220 330,220" fill="none" stroke="#a855f7" stroke-width="2"/>
  <circle cx="80" cy="200" r="14" fill="none" stroke="#39ff14" stroke-width="2"/>
  <!-- Title -->
  <text x="200" y="45" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#ff2d95">NEON SHOOTER</text>
</svg>

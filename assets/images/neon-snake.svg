<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="60%" style="stop-color:#0f1832"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Grid border -->
  <rect x="40" y="50" width="320" height="200" rx="4" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.6"/>
  <!-- Snake body -->
  <rect x="180" y="130" width="18" height="18" rx="4" fill="#00d4ff" opacity="0.5"/>
  <rect x="160" y="130" width="18" height="18" rx="4" fill="#00c4ee" opacity="0.55"/>
  <rect x="140" y="130" width="18" height="18" rx="4" fill="#00b4dd" opacity="0.6"/>
  <rect x="140" y="150" width="18" height="18" rx="4" fill="#00a4cc" opacity="0.65"/>
  <rect x="140" y="170" width="18" height="18" rx="4" fill="#0094bb" opacity="0.7"/>
  <rect x="160" y="170" width="18" height="18" rx="4" fill="#0084aa" opacity="0.8"/>
  <rect x="180" y="170" width="18" height="18" rx="4" fill="#007499" opacity="0.85"/>
  <!-- Snake head -->
  <rect x="200" y="130" width="18" height="18" rx="4" fill="#00d4ff"/>
  <!-- Eyes on head -->
  <rect x="211" y="135" width="3" height="3" fill="#0a0a1a"/>
  <rect x="211" y="141" width="3" height="3" fill="#0a0a1a"/>
  <!-- Food -->
  <circle cx="280" cy="100" r="7" fill="#ff2d95"/>
  <circle cx="278" cy="98" r="2.5" fill="white" opacity="0.4"/>
  <!-- Powerup -->
  <rect x="91" y="91" width="18" height="18" rx="5" fill="none" stroke="#ffe600" stroke-width="2"/>
  <text x="100" y="105" text-anchor="middle" font-size="11">⚡</text>
  <!-- Title -->
  <text x="200" y="35" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#00d4ff">NEON SNAKE</text>
</svg>

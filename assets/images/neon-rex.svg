<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="60%" style="stop-color:#0f1832"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="50" cy="40" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="120" cy="70" r="1" fill="white" opacity="0.4"/>
  <circle cx="200" cy="30" r="2" fill="white" opacity="0.5"/>
  <circle cx="300" cy="55" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="350" cy="80" r="1" fill="white" opacity="0.6"/>
  <!-- Ground line -->
  <line x1="0" y1="220" x2="400" y2="220" stroke="#a855f7" stroke-width="2" opacity="0.8"/>
  <!-- Grid lines -->
  <line x1="0" y1="240" x2="400" y2="240" stroke="#a855f7" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="260" x2="400" y2="260" stroke="#a855f7" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="280" x2="400" y2="280" stroke="#a855f7" stroke-width="0.5" opacity="0.15"/>
  <!-- Dino -->
  <g filter="url(#glow)">
    <rect x="84" y="182" width="30" height="24" rx="5" fill="#00d4ff"/>
    <rect x="94" y="170" width="28" height="20" rx="5" fill="#00d4ff"/>
    <rect x="108" y="182" width="14" height="8" fill="#00d4ff"/>
    <rect x="112" y="175" width="5" height="5" fill="#0a0a1a"/>
    <rect x="88" y="206" width="6" height="14" fill="#00d4ff"/>
    <rect x="102" y="206" width="6" height="14" fill="#00d4ff"/>
  </g>
  <!-- Obstacles -->
  <rect x="230" y="185" width="18" height="35" rx="3" fill="#ff2d95"/>
  <polygon points="230,185 239,172 248,185" fill="#ff2d95"/>
  <rect x="310" y="178" width="20" height="42" rx="3" fill="#a855f7"/>
  <polygon points="310,178 320,164 330,178" fill="#a855f7"/>
  <!-- Title -->
  <text x="200" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="36" font-weight="bold" fill="#00d4ff">NEON REX</text>
</svg>

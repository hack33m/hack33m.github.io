<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Road -->
  <path d="M140,300 Q160,200 200,150 Q240,100 260,0" fill="none" stroke="#333" stroke-width="80"/>
  <path d="M140,300 Q160,200 200,150 Q240,100 260,0" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8,8"/>
  <!-- Car -->
  <rect x="185" y="160" width="20" height="35" rx="5" fill="#00d4ff"/>
  <!-- Drift trails -->
  <path d="M188,195 Q180,220 175,260" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <path d="M202,195 Q194,220 189,260" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <!-- Title -->
  <text x="200" y="45" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#00d4ff">NEON DRIFT</text>
</svg>

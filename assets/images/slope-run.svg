<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Perspective track -->
  <polygon points="170,80 230,80 320,280 80,280" fill="none" stroke="#a855f7" stroke-width="2"/>
  <line x1="200" y1="80" x2="200" y2="280" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
  <!-- Horizontal lines for perspective -->
  <line x1="120" y1="180" x2="280" y2="180" stroke="#a855f7" stroke-width="1" opacity="0.2"/>
  <line x1="100" y1="230" x2="300" y2="230" stroke="#a855f7" stroke-width="1" opacity="0.2"/>
  <!-- Gap -->
  <rect x="145" y="200" width="30" height="15" fill="#ff2d95" opacity="0.3"/>
  <!-- Ball -->
  <circle cx="200" cy="160" r="12" fill="#39ff14"/>
  <!-- Title -->
  <text x="200" y="45" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#39ff14">SLOPE RUN</text>
</svg>

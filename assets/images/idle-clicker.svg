<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="60%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ff2d95"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Orb -->
  <circle cx="200" cy="150" r="50" fill="url(#orb)" opacity="0.9"/>
  <circle cx="200" cy="150" r="55" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
  <circle cx="200" cy="150" r="62" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.2"/>
  <!-- Click particles -->
  <circle cx="160" cy="115" r="4" fill="#39ff14" opacity="0.6"/>
  <circle cx="240" cy="120" r="3" fill="#ff6a00" opacity="0.5"/>
  <circle cx="230" cy="185" r="3.5" fill="#ffe600" opacity="0.6"/>
  <!-- +coins text -->
  <text x="250" y="130" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#39ff14" opacity="0.7">+10</text>
  <text x="150" y="105" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#ffe600" opacity="0.5">+5</text>
  <!-- Title -->
  <text x="200" y="45" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#a855f7">IDLE CLICKER</text>
</svg>
